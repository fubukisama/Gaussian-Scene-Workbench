name: Native Language Resources

# Manual diagnostic lane only. This does not replace or weaken Native Windows,
# the full native suite, worker checks, packaging, or C++ CodeQL.
on:
  workflow_dispatch:
    inputs:
      build_scope:
        description: Native target scope for the clean diagnostic build
        type: choice
        required: true
        default: focused
        options:
          - focused
          - full
      require_single_generator:
        description: Require exactly one native catalog generation invocation
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  language-resources:
    name: Native catalog loading
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_FORCE_STDERR_LOGGING: "1"
      QT_LOGGING_TO_CONSOLE: "1"
      GSW_LANGUAGE_BUILD_SCOPE: ${{ inputs.build_scope }}
      GSW_LANGUAGE_REQUIRE_SINGLE_GENERATOR: ${{ inputs.require_single_generator }}
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@v7

      - name: Record source and run identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'native/language-resources-artifact'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout differs from the dispatched source commit.' }
          $head | Set-Content -LiteralPath "$evidence/source-commit.txt" -Encoding utf8
          [ordered]@{
            sourceCommit = $head
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflow = $env:GITHUB_WORKFLOW
            workflowSha = $env:GITHUB_WORKFLOW_SHA
            runnerOS = $env:RUNNER_OS
            buildScope = $env:GSW_LANGUAGE_BUILD_SCOPE
            requireSingleGenerator = $env:GSW_LANGUAGE_REQUIRE_SINGLE_GENERATOR
            recordedAtUtc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath "$evidence/source-run.json" -Encoding utf8

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Install native configure dependencies
        shell: pwsh
        run: |
          & '${{ steps.qa-python.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Language QA dependency installation failed.' }
          $root = Join-Path $PWD 'native/.deps-language-resources'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Language QA configure dependency installation failed.' }

      - name: Configure and build the selected native target scope
        id: focused-build
        shell: pwsh
        run: |
          $scope = $env:GSW_LANGUAGE_BUILD_SCOPE
          if ($scope -notin @('focused','full')) { throw 'Unsupported native language build scope.' }
          if (Test-Path -LiteralPath native/build-lr) { throw 'A fresh diagnostic build directory is required.' }
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-lr -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DPython3_EXECUTABLE=${{ steps.qa-python.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps-language-resources/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'Language QA configure failed.' }
          # One normal solution build, never simultaneous independent CMake
          # processes. Full scope preserves the ordinary all-target build graph.
          $arguments = @('--build','native/build-lr','--config','Release','--parallel')
          if ($scope -ceq 'focused') {
            $arguments += @('--target','gsw_initialization_editor_ui_tests','gsw_initialization_dialog_ui_tests','gsw_mesh_geometry_dialog_ui_tests')
          }
          & cmake @arguments 2>&1 |
            Tee-Object -FilePath native/language-resources-artifact/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Language QA target build failed.' }

      - name: Record actual native catalog generation activity
        id: generation-observation
        if: always()
        env:
          GSW_LANGUAGE_BUILD_OUTCOME: ${{ steps.focused-build.outcome }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'native/language-resources-artifact'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $log = Join-Path $evidence 'build.log'
          $markers = @()
          $logHash = $null
          if (Test-Path -LiteralPath $log -PathType Leaf) {
            # MSBuild may prefix concurrent project output with a project ID.
            $markers = @(Get-Content -LiteralPath $log | Where-Object { $_ -match 'Native i18n:' })
            $logHash = (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $requested = $env:GSW_LANGUAGE_REQUIRE_SINGLE_GENERATOR.ToLowerInvariant()
          if ($requested -notin @('true','false')) { throw 'Invalid single-generator diagnostic input.' }
          $requireSingle = $requested -ceq 'true'
          [ordered]@{
            schema = 'gsw.native_language_generation_observation/1'
            sourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            buildScope = $env:GSW_LANGUAGE_BUILD_SCOPE
            buildOutcome = $env:GSW_LANGUAGE_BUILD_OUTCOME
            requireSingleGenerator = $requireSingle
            generatorInvocationCount = $markers.Count
            markerLines = $markers
            buildLogSha256 = $logHash
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$evidence/generation-observation.json" -Encoding utf8
          Write-Output "Native catalog generation invocations: $($markers.Count)"
          if ($requireSingle -and $env:GSW_LANGUAGE_BUILD_OUTCOME -ceq 'success' -and $markers.Count -ne 1) {
            throw 'Clean diagnostic build did not invoke the native catalog generator exactly once.'
          }

      - name: Repeat the original initialization editor regression
        id: editor-regression
        if: ${{ !cancelled() && steps.focused-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $result = 1
          try {
            ctest --test-dir native/build-lr -C Release --no-tests=error --verbose --output-on-failure `
              --repeat until-fail:20 `
              --output-log native/language-resources-artifact/editor.log `
              --output-junit (Join-Path $PWD 'native/language-resources-artifact/editor.xml') `
              -R '^native_initialization_editor_ui$'
            $result = $LASTEXITCODE
          } finally {
            $last = 'native/build-lr/Testing/Temporary/LastTest.log'
            if (Test-Path -LiteralPath $last) { Copy-Item -LiteralPath $last -Destination native/language-resources-artifact/editor-LastTest.log }
            $failed = 'native/build-lr/Testing/Temporary/LastTestsFailed.log'
            if (Test-Path -LiteralPath $failed) { Copy-Item -LiteralPath $failed -Destination native/language-resources-artifact/editor-LastTestsFailed.log }
          }
          if ($result -ne 0) { throw 'Original initialization editor regression failed; exact diagnostics are retained.' }

      - name: Verify related dialogs and translation contracts
        if: ${{ !cancelled() && steps.focused-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $result = 1
          try {
            ctest --test-dir native/build-lr -C Release --no-tests=error --verbose --output-on-failure `
              --output-log native/language-resources-artifact/related-contracts.log `
              --output-junit (Join-Path $PWD 'native/language-resources-artifact/related-contracts.xml') `
              -R '^(native_initialization_dialog_ui|native_mesh_geometry_dialog_ui|native_translation_catalog|native_translation_validator_tests)$'
            $result = $LASTEXITCODE
          } finally {
            $last = 'native/build-lr/Testing/Temporary/LastTest.log'
            if (Test-Path -LiteralPath $last) { Copy-Item -LiteralPath $last -Destination native/language-resources-artifact/related-contracts-LastTest.log }
            $failed = 'native/build-lr/Testing/Temporary/LastTestsFailed.log'
            if (Test-Path -LiteralPath $failed) { Copy-Item -LiteralPath $failed -Destination native/language-resources-artifact/related-contracts-LastTestsFailed.log }
          }
          if ($result -ne 0) { throw 'Related initialization, mesh or translation contracts failed.' }

      - name: Retain generated catalogs and exact test executables
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $PWD 'native/build-lr'
          $evidence = Join-Path $PWD 'native/language-resources-artifact'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $records = [Collections.Generic.List[object]]::new()
          $inputs = @()
          if (Test-Path -LiteralPath "$build/i18n") {
            $inputs += @(Get-ChildItem -LiteralPath "$build/i18n" -File -Filter '*.qm' | ForEach-Object { @{kind='qm';file=$_} })
          }
          $cache = Join-Path $build 'CMakeCache.txt'
          if (Test-Path -LiteralPath $cache) {
            foreach ($line in Get-Content -LiteralPath $cache) {
              if ($line -match '^GSW_QTBASE_(?:zh_CN|ja):FILEPATH=(.+)$' -and (Test-Path -LiteralPath $Matches[1] -PathType Leaf)) {
                $inputs += @{kind='qtbase-qm';file=(Get-Item -LiteralPath $Matches[1])}
              }
            }
          }
          if (Test-Path -LiteralPath $build) {
            $inputs += @(Get-ChildItem -LiteralPath $build -File -Recurse -Filter 'qrc_*.cpp' |
              Where-Object { $_.BaseName -match '(_languages|_qtbase_)' } |
              ForEach-Object { @{kind='qrc';file=$_} })
          }
          foreach ($name in @('gsw_initialization_editor_ui_tests.exe','gsw_initialization_dialog_ui_tests.exe','gsw_mesh_geometry_dialog_ui_tests.exe')) {
            $path = Join-Path $build "Release/$name"
            if (Test-Path -LiteralPath $path -PathType Leaf) { $inputs += @{kind='executable';file=(Get-Item -LiteralPath $path)} }
          }
          foreach ($input in $inputs) {
            $directory = Join-Path $evidence "generated/$($input.kind)"
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            $file = $input.file
            $destination = Join-Path $directory $file.Name
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (Test-Path -LiteralPath $destination) {
              if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'Generated evidence basenames collided with different bytes.' }
              continue
            }
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'Generated evidence copy differs.' }
            $records.Add([ordered]@{kind=$input.kind;name=$file.Name;size=$file.Length;sha256=$hash})
          }
          [ordered]@{
            schema='gsw.native_language_resource_inputs/1'
            sourceCommit=$env:GITHUB_SHA
            runId=$env:GITHUB_RUN_ID
            runAttempt=$env:GITHUB_RUN_ATTEMPT
            files=$records.ToArray()
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$evidence/generated-files.json" -Encoding utf8

      - name: Upload source-bound language diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-language-resources-diagnostics
          path: native/language-resources-artifact/
          if-no-files-found: warn
          retention-days: 7
