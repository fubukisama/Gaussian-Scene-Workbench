name: Native Viewport Status

# Manual fast feedback for truthful presented-frame status. Final delivery
# retains the separate Native Windows/full-scene/security workflows.
on:
  workflow_dispatch:
    inputs:
      contract_scope:
        description: Focused contract group
        type: choice
        default: all
        options:
          - all
          - project-only
          - ci-repair

permissions:
  contents: read

jobs:
  viewport-status:
    name: Viewport status and scheduling contracts
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_FORCE_STDERR_LOGGING: "1"
      QT_LOGGING_TO_CONSOLE: "1"
      QT_STYLE_OVERRIDE: windows11
      GSW_STATUS_SCOPE: ${{ inputs.contract_scope || 'all' }}
      GSW_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/native/viewport-status-artifact/screenshots
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@v7

      - name: Record actual source and run identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'native/viewport-status-artifact'
          New-Item -ItemType Directory -Path "$evidence/screenshots" -Force | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Source differs from the dispatched commit.' }
          [ordered]@{
            sourceCommit = $head
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflow = $env:GITHUB_WORKFLOW
            workflowSha = $env:GITHUB_WORKFLOW_SHA
            runnerOS = $env:RUNNER_OS
            recordedAtUtc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath "$evidence/source-run.json" -Encoding utf8

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Verify native boundary and install focused dependencies
        shell: pwsh
        run: |
          & '${{ steps.qa-python.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA dependency installation failed.' }
          & '${{ steps.qa-python.outputs.python-path }}' -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Native source boundary failed.' }
          $root = Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Codec dependency installation failed.' }

      - name: Build only the requested contract targets
        id: focused-build
        shell: pwsh
        run: |
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-viewport-status -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DCMAKE_CXX_FLAGS=/MP2' '-DPython3_EXECUTABLE=${{ steps.qa-python.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'Viewport status configure failed.' }
          $targets = @('gsw_workspace_scene_format_tests')
          if ($env:GSW_STATUS_SCOPE -eq 'all') {
            $targets += @('GaussianSceneWorkbench', 'gsw_frame_rate_counter_tests', 'gsw_recovery_store_tests', 'gsw_viewport_camera_tests')
          }
          elseif ($env:GSW_STATUS_SCOPE -eq 'ci-repair') {
            $targets += @('GaussianSceneWorkbench', 'gsw_runtime_decoupling_ui_tests')
          }
          elseif ($env:GSW_STATUS_SCOPE -ne 'project-only') { throw 'Unknown contract group.' }
          cmake --build native/build-viewport-status --config Release --parallel --target $targets 2>&1 |
            Tee-Object -FilePath native/viewport-status-artifact/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Viewport status build failed.' }

      - name: Prepare real Windows display and OpenGL
        id: focused-graphics
        if: ${{ inputs.contract_scope != 'project-only' }}
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1

      - name: Verify project presentation persistence without model mutation
        if: ${{ !cancelled() && steps.focused-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $contracts = '^(native_viewport_scheduling_(light|dark)|frame_rate_counter|recovery_store|viewport_camera)$'
          $repeat = @()
          if ($env:GSW_STATUS_SCOPE -eq 'ci-repair') {
            # Match the unoverridden platform style used by the full suite.
            Remove-Item Env:QT_STYLE_OVERRIDE -ErrorAction SilentlyContinue
            $contracts = '^(native_runtime_decoupling_ui|native_adaptive_display_layout|native_viewport_scheduling_(light|dark))$'
            $repeat = @('--repeat', 'until-fail:5')
          }
          ctest --test-dir native/build-viewport-status -C Release --no-tests=error --verbose --output-on-failure `
            --output-log native/viewport-status-artifact/project-contracts.log `
            --output-junit (Join-Path $PWD 'native/viewport-status-artifact/project-contracts.xml') `
            -R '^workspace_scene_format$'
          if ($LASTEXITCODE -ne 0) { throw 'Project presentation persistence contracts failed; existing assertions remain unchanged.' }

      - name: Verify existing cadence and actual window scheduling
        if: ${{ !cancelled() && steps.focused-build.outcome == 'success' && steps.focused-graphics.outcome == 'success' }}
        shell: pwsh
        run: |
          ctest --test-dir native/build-viewport-status -C Release --no-tests=error --verbose --output-on-failure `
            --output-log native/viewport-status-artifact/status-contracts.log `
            --output-junit (Join-Path $PWD 'native/viewport-status-artifact/status-contracts.xml') `
            -R $contracts @repeat
          if ($LASTEXITCODE -ne 0) { throw 'Viewport status contracts failed; existing assertions and deadlines remain unchanged.' }

      - name: Retain exact source status logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-viewport-status-acceptance
          path: |
            native/viewport-status-artifact/
            native/build-viewport-status/Testing/Temporary/LastTest.log
            native/build-viewport-status/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 7
