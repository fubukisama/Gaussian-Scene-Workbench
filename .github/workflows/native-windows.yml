name: Native Windows

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "gaussian-splatting/**"
      - "training_kit/**"
      - "scripts/**"
      - "packaging/windows/**"
      - "docs/LOCALIZATION.md"
      - ".github/workflows/native-windows.yml"
      - "docs/NATIVE_CI.md"
      - "docs/NATIVE_MIGRATION.md"
      - "docs/NATIVE_PARITY.md"
      - "docs/COLMAP_SETUP.md"
      - "docs/WINDOWS_APPLICATION_CONTROL.md"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "gaussian-splatting/**"
      - "training_kit/**"
      - "scripts/**"
      - "packaging/windows/**"
      - "docs/LOCALIZATION.md"
      - ".github/workflows/native-windows.yml"
      - "docs/NATIVE_CI.md"
      - "docs/NATIVE_MIGRATION.md"
      - "docs/NATIVE_PARITY.md"
      - "docs/COLMAP_SETUP.md"
      - "docs/WINDOWS_APPLICATION_CONTROL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-acceptance:
    name: Upstream viewport acceptance
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: windows-2022
    # 39379171732 spent 12m33s compiling the expanded native targets and
    # 15m51s executing all 46 public tests; bootstrap/upload exhausted 30m.
    # Preserve every test/individual timeout and enough time to retain failures.
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt
      - name: Install acceptance dependencies
        shell: pwsh
        run: |
          & '${{ steps.qa-python.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Acceptance QA dependencies failed." }
          & '${{ steps.qa-python.outputs.python-path }}' -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw "Native source boundary verification failed." }
          & '${{ steps.qa-python.outputs.python-path }}' -B -m unittest native.backend.tests.test_initialization native.worker.test_initialization native.backend.tests.test_gs_geometry native.worker.test_gs_geometry native.worker.test_geometry_cli_utf8 native.worker.test_gs_geometry_runtime native.backend.tests.test_geometry_evaluation native.backend.tests.test_reconstruction_comparison.ReconstructionComparisonTests
          if ($LASTEXITCODE -ne 0) { throw "General reconstruction worker contracts failed before native compilation." }
          $root = Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw "Acceptance codec dependencies failed." }
      # This is an additional short public-behavior gate, not a replacement for
      # the traced full build, all native tests, worker tests or security scans.
      - name: Configure and build acceptance
        shell: pwsh
        run: |
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-acceptance -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DPython3_EXECUTABLE=${{ steps.qa-python.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "Acceptance configure failed." }
          cmake --build native/build-acceptance --config Release --parallel --target GaussianSceneWorkbench gsw_blender_view_navigation_tests gsw_upload_drain_budget_tests gsw_training_telemetry_tests gsw_process_output_fixture gsw_native_tests gsw_geometry_product_tests gsw_initialization_editor_ui_tests gsw_initialization_dialog_ui_tests gsw_mesh_geometry_dialog_ui_tests gsw_native_viewport_locale_tests gsw_training_batch_ui_tests
          if ($LASTEXITCODE -ne 0) { throw "Acceptance build failed." }
      - name: Prepare real Windows display and OpenGL
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1
      - name: Verify actual upstream viewport behavior
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
          GSW_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/native/acceptance-artifact
          GSW_COORDINATE_SCENE_SCREENSHOT_DIR: ${{ github.workspace }}/native/acceptance-artifact/coordinates
          GSW_RESOURCE_HUD_CAPTURE_PATH: ${{ github.workspace }}/native/acceptance-artifact/resource-hud.png
          GSW_LANGUAGE_SCREENSHOT_DIR: ${{ github.workspace }}/native/acceptance-artifact/languages
        run: |
          ctest --test-dir native/build-acceptance -C Release --no-tests=error --output-on-failure `
            --output-log native/acceptance.log `
            -R '^(native_workspace_drop_(zh_CN|en_US|ja_JP)|native_upstream_navigation_(zh_CN|en_US|ja_JP)|native_blender_viewport_presentation_(zh_CN|en_US|ja_JP)|native_point_streaming|blender_view_navigation|upload_drain_budget|native_translation_catalog|native_translation_validator_tests|native_viewport_locale_contract|native_training_performance_ui|native_quality_comparison_ui|native_quality_measurement_ui|native_scale_constraints_ui|native_training_batch_ui|native_training_batch_contract_(zh_CN|en_US|ja_JP)|native_training_batch_lifecycle|native_camera_scale_p1|native_training_performance_policy|native_training_preflight|native_processing_completion|native_language_(zh_CN|en_US|ja_JP)|native_resource_budget_hud|native_texture_text_masks|native_texture_text_(zh_CN|en_US|ja_JP)_(light|dark)|training_telemetry|native_scene_coordinates_(zh_CN|en_US|ja_JP)|native_geometry_product|native_initialization_editor_ui|native_initialization_dialog_ui|native_mesh_geometry_dialog_ui|native_general_reconstruction_contracts|native_general_version_adoption|native_mesh_generation)$'
          if ($LASTEXITCODE -ne 0) { throw "Actual viewport acceptance failed." }
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-upstream-viewport-acceptance
          path: |
            native/acceptance.log
            native/acceptance-artifact/
            native/build-acceptance/blender-viewport-evidence/
            native/build-acceptance/texture-text-captures/
            native/build-acceptance/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Qt 6 native preview
    # Feature PRs into native main run the same gates as main pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    # Qt's win64_msvc2022_64 package must use the VS 2022 runner image.
    runs-on: windows-2022
    # Run 38698219759 needed 55m traced compilation plus analysis/bootstrap;
    # the 90m job cap cancelled during test 59/115 after 58 passes. Budget the pipeline
    # while preserving every CTest timeout, assertion and package gate.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # Keep Qt's installer Python separate from the tested backend interpreter.
      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Install native QA dependencies
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Native QA dependency installation failed." }
          & $env:QA_PYTHON -c "import sys, numpy, plyfile, trimesh; from PIL import Image; print('Native QA Python:', sys.executable, sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "Native QA dependency import check failed." }
          & $env:QA_PYTHON -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw "Native source boundary verification failed." }

      # Fail fast on CPU/backend regressions before the traced C++ build.
      # This is the same complete worker suite, not a filtered replacement.
      - name: Test native worker
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
          GSW_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/gsw-security-fixtures
        run: |
          & $env:QA_PYTHON -B -m unittest native.worker.test_gsw_worker native.worker.test_import_preflight native.worker.test_training_runtime native.worker.test_training_step_profile native.worker.test_training_resource_policy native.worker.test_training_acceleration native.worker.test_training_loss native.worker.test_surfel_regularization native.worker.test_training_checkpoint native.worker.test_training_camera_lookahead native.worker.test_training_image_pipeline native.worker.test_training_capacity_storage native.worker.test_surfel_render_adapter native.worker.test_training_quality native.worker.test_image_quality_measurement native.worker.test_training_stress native.backend.tests.test_training_backends native.backend.tests.test_path_security native.backend.tests.test_command_security native.backend.tests.test_training_telemetry native.backend.tests.test_texture_collection native.backend.tests.test_scene_workspace
          if ($LASTEXITCODE -ne 0) { throw "Native worker tests failed." }
          & $env:QA_PYTHON -B -m unittest native.backend.tests.test_atomic_file native.backend.tests.test_camera_identity_portability native.backend.tests.test_scale_constraints native.backend.tests.test_model_scale_version native.backend.tests.test_trajectory_dataset native.backend.tests.test_training_batch_plan native.worker.test_scale_constraints native.worker.test_training_seed native.worker.test_training_batch
          if ($LASTEXITCODE -ne 0) { throw "Native camera/scale P1 worker tests failed." }
          & $env:QA_PYTHON -B -m unittest native.backend.tests.test_initialization native.worker.test_initialization native.backend.tests.test_gs_geometry native.worker.test_gs_geometry native.worker.test_geometry_cli_utf8 native.worker.test_gs_geometry_runtime native.backend.tests.test_geometry_evaluation native.backend.tests.test_reconstruction_comparison.ReconstructionComparisonTests
          if ($LASTEXITCODE -ne 0) { throw "General reconstruction worker contracts failed." }
          & $env:QA_PYTHON -B -m unittest native.backend.tests.test_recorded_ply_export native.worker.test_training_batch_connection
          if ($LASTEXITCODE -ne 0) { throw "Recorded PLY export and persistent batch contracts failed." }

      - name: Install SPZ codec dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "native/.deps"
          New-Item -ItemType Directory -Force -Path "$root/binary-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$root/binary-cache"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw "SPZ codec dependencies failed to build." }

      - name: Initialize native C++ code scanning
        id: native-codeql
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Configure
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          $releaseDate = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            "-DPython3_EXECUTABLE=$env:QA_PYTHON" `
            -DGSW_TEST_OPENGL_BACKEND=software `
            "-DGSW_RELEASE_DATE=$releaseDate" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        id: native-build
        timeout-minutes: 75
        shell: pwsh
        run: cmake --build native/build-ci --config Release --parallel

      - name: Analyze native C++ code
        if: ${{ !cancelled() && steps.native-codeql.outcome == 'success' && steps.native-build.outcome == 'success' }}
        timeout-minutes: 20
        uses: github/codeql-action/analyze@v4
        with:
          category: /native/c-cpp

      - name: Prepare native test display
        shell: pwsh
        run: ./scripts/setup_native_ci_display.ps1

      - name: Prepare modern software OpenGL
        shell: pwsh
        run: ./scripts/setup_native_ci_graphics.ps1

      - name: Verify native graphics bootstrap
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir native/build-ci -C Release --no-tests=error -R "^(system_resource_probe|native_infinite_reference_grid|native_light_gaussian_interaction|native_textured_paged_mesh_scene)$" --output-on-failure

      - name: Test
        timeout-minutes: 50
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir native/build-ci -C Release --no-tests=error --output-on-failure --output-log native/full-tests.log

      - name: Upload full native test evidence
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-full-test-evidence
          path: |
            native/full-tests.log
            native/build-ci/Testing/Temporary/LastTest.log
            native/build-ci/Testing/Temporary/LastTestsFailed.log
            native/build-ci/Testing/Temporary/CTestCostData.txt
            ${{ runner.temp }}/gsw-infinite-grid-initial.png
            ${{ runner.temp }}/gsw-infinite-grid-smoke.png
          if-no-files-found: warn
          retention-days: 7

      - name: Parse setup scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/build_native.ps1",
            "scripts/write_native_source_manifest.ps1",
            "scripts/bootstrap_native.ps1",
            "scripts/check_3dgs_env.ps1",
            "scripts/install_colmap.ps1",
            "scripts/sign_windows_artifacts.ps1",
            "scripts/stage_native_backend.ps1",
            "scripts/setup_native_ci_display.ps1",
            "scripts/setup_native_ci_graphics.ps1",
            "scripts/bootstrap_inno_setup.ps1",
            "scripts/build_windows_installer.ps1",
            "scripts/test_windows_installer.ps1",
            "scripts/test_windows_installer_ui.ps1",
            "scripts/test_windows_shortcut_unicode.ps1",
            "scripts/test_windows_installer_build.ps1",
            "scripts/stage_native_crt.ps1",
            "scripts/test_native_crt.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }

      - name: Install application
        shell: pwsh
        run: cmake --install native/build-ci --config Release --prefix native/artifact

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "native/artifact/bin/Gaussian Scene Workbench.exe"
          windeployqt --release --no-translations --compiler-runtime $exe
          ./scripts/stage_native_crt.ps1 -PackageRoot (Join-Path $PWD 'native/artifact')
          $crt = Get-Content native/artifact/native-crt-manifest.json -Raw | ConvertFrom-Json
          ./scripts/test_native_crt.ps1 -SourcePackageRoot "$PWD/native/artifact" -TestRoot "$env:RUNNER_TEMP/gsw-crt-acceptance" -DumpBinPath $crt.dumpBin
          Copy-Item native/README.md native/artifact/README.md
          Copy-Item native/build_manifest.json native/artifact/build_manifest.json
          Copy-Item docs/NATIVE_MIGRATION.md native/artifact/NATIVE_MIGRATION.md
          Copy-Item docs/NATIVE_PARITY.md native/artifact/NATIVE_PARITY.md
          Copy-Item docs/COLMAP_SETUP.md native/artifact/COLMAP_SETUP.md
          Copy-Item docs/WINDOWS_APPLICATION_CONTROL.md native/artifact/WINDOWS_APPLICATION_CONTROL.md
          Copy-Item LICENSE native/artifact/LICENSE
          Copy-Item COPYING native/artifact/COPYING
          Copy-Item native/LICENSE.md native/artifact/native/LICENSE.md
          ./scripts/write_native_source_manifest.ps1 -PackageRoot (Join-Path $PWD 'native/artifact')
          Copy-Item THIRD_PARTY_LICENSES.md native/artifact/THIRD_PARTY_LICENSES.md
          Copy-Item docs/LOCALIZATION.md native/artifact/LOCALIZATION.md
          Copy-Item docs/STUDIO_COMPARISON.md native/artifact/STUDIO_COMPARISON.md

      - name: Stage native compute backend
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: >-
          ./scripts/stage_native_backend.ps1
          -SourceRoot $PWD
          -DestinationRoot (Join-Path $PWD "native/artifact")
          -PythonExecutable $env:QA_PYTHON

      - name: Verify native-only package
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -B -c "from pathlib import Path; files=[Path('native/artifact/native/worker/gsw_worker.py'),Path('native/artifact/native/worker/import_preflight.py'),Path('native/artifact/native/worker/training_preflight.py'),Path('native/artifact/native/backend/compute.py'),Path('native/artifact/native/backend/reconstruction_quality.py'),Path('native/artifact/native/backend/video_extract.py')]; [compile(path.read_bytes(),str(path),'exec') for path in files]"
          if ($LASTEXITCODE -ne 0) { throw "Packaged Python syntax check failed." }
          & $env:QA_PYTHON -I -B scripts/verify_native_backend.py --root native/artifact --package
          if ($LASTEXITCODE -ne 0) { throw "Native package boundary verification failed." }
          $exe = "native/artifact/bin/Gaussian Scene Workbench.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Native executable is missing."
          }
          $requiredBackend = @(
            "native/artifact/native/worker/gsw_worker.py",
            "native/artifact/native/worker/import_preflight.py",
            "native/artifact/native/worker/training_preflight.py",
            "native/artifact/native/backend/__init__.py",
            "native/artifact/native/backend/compute.py",
            "native/artifact/native/backend/reconstruction_quality.py",
            "native/artifact/native/backend/video_extract.py",
            "native/artifact/scripts/check_3dgs_env.ps1",
            "native/artifact/gaussian-splatting/train.py",
            "native/artifact/training_kit/apply_local_fixes.bat",
            "native/artifact/scripts/install_colmap.ps1",
            "native/artifact/scripts/sign_windows_artifacts.ps1",
            "native/artifact/COLMAP_SETUP.md",
            "native/artifact/WINDOWS_APPLICATION_CONTROL.md",
            "native/artifact/backend_manifest.json"
          )
          $missingBackend = $requiredBackend | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missingBackend) {
            $missingBackend
            throw "Native artifact is missing required compute backend files."
          }
          & $env:QA_PYTHON -I -B native/artifact/native/worker/import_preflight.py --backend-root native/artifact
          if ($LASTEXITCODE -ne 0) { throw "Packaged native compute import failed." }

      - name: Build and verify Windows setup wizard
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -B scripts/test_windows_installer.py
          if ($LASTEXITCODE -ne 0) { throw "Installer contract tests failed." }
          ./scripts/test_windows_shortcut_unicode.ps1 -TestRoot "$env:RUNNER_TEMP/gsw-shortcut-validation"
          $compiler = ./scripts/bootstrap_inno_setup.ps1 -InstallRoot "$env:RUNNER_TEMP/gsw-inno-7.1.0" -CacheRoot "$env:RUNNER_TEMP/gsw-inno-cache"
          ./scripts/test_windows_installer_build.ps1 -TestRoot "$env:RUNNER_TEMP/gsw-wrapper-validation" -InnoCompiler $compiler -PythonExecutable $env:QA_PYTHON
          ./scripts/build_windows_installer.ps1 -PackageRoot "$PWD/native/artifact" -OutputDirectory "$PWD/native/setup" -PythonExecutable $env:QA_PYTHON -InnoCompiler $compiler
          ./scripts/build_windows_installer.ps1 -PackageRoot "$PWD/native/artifact" -OutputDirectory "$PWD/native/setup-test" -PythonExecutable $env:QA_PYTHON -InnoCompiler $compiler -TestBuild
          $testSetup = (Get-ChildItem native/setup-test -File -Filter '*.exe').FullName
          ./scripts/test_windows_installer.ps1 -SetupPath $testSetup -TestRoot "$env:RUNNER_TEMP/gsw-installer-validation"
          ./scripts/test_windows_installer_ui.ps1 -SetupPath $testSetup -TestRoot "$PWD/native/setup-validation"

      - name: Upload Windows setup installer
        uses: actions/upload-artifact@v7
        with:
          name: Gaussian-Scene-Workbench-windows-x64-setup
          path: |
            native/setup/*.exe
            native/setup/*.exe.sha256
            native/setup/*.exe.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-installer-acceptance
          path: |
            native/setup-validation/
            ${{ runner.temp }}/gsw-installer-validation/
            ${{ runner.temp }}/gsw-shortcut-validation/
            ${{ runner.temp }}/gsw-wrapper-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows preview
        uses: actions/upload-artifact@v7
        with:
          name: Gaussian-Scene-Workbench-0.3.1-native-preview-win-x64
          path: native/artifact/
          if-no-files-found: error
          retention-days: 30

      # Keep a failed run failed, but retain binaries and logs for reproducing
      # rendering failures on a workstation with a hardware OpenGL driver.
      - name: Collect failed-run diagnostic build
        if: failure() && steps.native-build.outcome == 'success'
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          $root = Join-Path $PWD "native/diagnostic-artifact"
          cmake --install native/build-ci --config Release --prefix $root
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic install failed." }
          windeployqt --release --no-translations --compiler-runtime "$root/bin/Gaussian Scene Workbench.exe"
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic runtime deployment failed." }
          Copy-Item native/build_manifest.json "$root/build_manifest.json"
          ./scripts/stage_native_backend.ps1 -SourceRoot $PWD -DestinationRoot $root -PythonExecutable $env:QA_PYTHON
          Copy-Item native/build-ci/Testing "$root/Testing" -Recurse
          Copy-Item native/build-ci/Release/gsw_gaussian_sh_tests.exe "$root/bin/"

      - name: Upload failed-run diagnostics
        if: failure() && steps.native-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-failed-run-diagnostics
          path: native/diagnostic-artifact/
          if-no-files-found: error
          retention-days: 7
