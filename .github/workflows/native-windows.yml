name: Native Windows

on:
  push:
    branches:
      - agent/native-desktop-0.3
    paths:
      - "native/**"
      - "crop_editor/server.py"
      - "crop_editor/video_extract.py"
      - "crop_editor/tests/test_training_backends.py"
      - "crop_editor/tests/test_*security.py"
      - "gaussian-splatting/**"
      - "training_kit/**"
      - "scripts/build_native.ps1"
      - "scripts/requirements-native-checks.txt"
      - "scripts/setup_native_ci_*.ps1"
      - "scripts/*native_i18n.py"
      - "docs/LOCALIZATION.md"
      - "scripts/bootstrap_3dgs_editor.ps1"
      - "scripts/check_3dgs_env.ps1"
      - "scripts/install_colmap.ps1"
      - "scripts/sign_windows_artifacts.ps1"
      - "scripts/stage_native_backend.ps1"
      - ".github/workflows/native-windows.yml"
      - "docs/NATIVE_CI.md"
      - "docs/NATIVE_MIGRATION.md"
      - "docs/NATIVE_PARITY.md"
      - "docs/COLMAP_SETUP.md"
      - "docs/WINDOWS_APPLICATION_CONTROL.md"
      - "README.md"
  pull_request:
    paths:
      - "native/**"
      - "crop_editor/server.py"
      - "crop_editor/video_extract.py"
      - "crop_editor/tests/test_training_backends.py"
      - "crop_editor/tests/test_*security.py"
      - "gaussian-splatting/**"
      - "training_kit/**"
      - "scripts/build_native.ps1"
      - "scripts/requirements-native-checks.txt"
      - "scripts/setup_native_ci_*.ps1"
      - "scripts/*native_i18n.py"
      - "docs/LOCALIZATION.md"
      - "scripts/bootstrap_3dgs_editor.ps1"
      - "scripts/check_3dgs_env.ps1"
      - "scripts/install_colmap.ps1"
      - "scripts/sign_windows_artifacts.ps1"
      - "scripts/stage_native_backend.ps1"
      - ".github/workflows/native-windows.yml"
      - "docs/NATIVE_CI.md"
      - "docs/NATIVE_MIGRATION.md"
      - "docs/NATIVE_PARITY.md"
      - "docs/COLMAP_SETUP.md"
      - "docs/WINDOWS_APPLICATION_CONTROL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-acceptance:
    name: Upstream viewport acceptance
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'agent/native-desktop-0.3') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/native-desktop-0.3')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt
      - name: Install acceptance dependencies
        shell: pwsh
        run: |
          & '${{ steps.qa-python.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Acceptance QA dependencies failed." }
          $root = Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw "Acceptance codec dependencies failed." }
      # This is an additional short public-behavior gate, not a replacement for
      # the traced full build, all native tests, worker tests or security scans.
      - name: Configure and build acceptance
        shell: pwsh
        run: |
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-acceptance -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DPython3_EXECUTABLE=${{ steps.qa-python.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "Acceptance configure failed." }
          cmake --build native/build-acceptance --config Release --parallel --target GaussianSceneWorkbench gsw_blender_view_navigation_tests gsw_upload_drain_budget_tests gsw_training_telemetry_tests gsw_process_output_fixture
          if ($LASTEXITCODE -ne 0) { throw "Acceptance build failed." }
      - name: Prepare real Windows display and OpenGL
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1
      - name: Verify actual upstream viewport behavior
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
          GSW_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/native/acceptance-artifact
          GSW_COORDINATE_SCENE_SCREENSHOT_DIR: ${{ github.workspace }}/native/acceptance-artifact/coordinates
        run: |
          ctest --test-dir native/build-acceptance -C Release --no-tests=error --output-on-failure `
            --output-log native/acceptance.log `
            -R '^(native_workspace_drop_(zh_CN|en_US|ja_JP)|native_upstream_navigation_(zh_CN|en_US|ja_JP)|native_point_streaming|blender_view_navigation|upload_drain_budget|native_translation_catalog|native_translation_validator_tests|native_training_performance_ui|native_training_performance_policy|native_training_preflight|training_telemetry|native_scene_coordinates_(zh_CN|en_US|ja_JP))$'
          if ($LASTEXITCODE -ne 0) { throw "Actual viewport acceptance failed." }
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-upstream-viewport-acceptance
          path: |
            native/acceptance.log
            native/acceptance-artifact/
            native/build-acceptance/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Qt 6 native preview
    # Match the native-only scan scope, including PR head and manual selection.
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'agent/native-desktop-0.3') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/native-desktop-0.3')
    # Qt's win64_msvc2022_64 package must use the VS 2022 runner image.
    runs-on: windows-2022
    # The traced build has taken 20-35 minutes on the hosted runner. Leave room
    # for code analysis, every native regression and the verified package upload.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # Keep Qt's installer Python separate from the tested backend interpreter.
      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Install native QA dependencies
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw "Native QA dependency installation failed." }
          & $env:QA_PYTHON -c "import sys, numpy, plyfile, trimesh; from PIL import Image; print('Native QA Python:', sys.executable, sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "Native QA dependency import check failed." }

      - name: Install SPZ codec dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "native/.deps"
          New-Item -ItemType Directory -Force -Path "$root/binary-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$root/binary-cache"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw "SPZ codec dependencies failed to build." }

      - name: Initialize native C++ code scanning
        id: native-codeql
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'agent/native-desktop-0.3') ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/native-desktop-0.3')
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Configure
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          $releaseDate = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            "-DPython3_EXECUTABLE=$env:QA_PYTHON" `
            -DGSW_TEST_OPENGL_BACKEND=software `
            "-DGSW_RELEASE_DATE=$releaseDate" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        id: native-build
        shell: pwsh
        run: cmake --build native/build-ci --config Release --parallel

      - name: Analyze native C++ code
        if: ${{ !cancelled() && steps.native-codeql.outcome == 'success' && steps.native-build.outcome == 'success' }}
        uses: github/codeql-action/analyze@v4
        with:
          category: /native/c-cpp

      - name: Prepare native test display
        shell: pwsh
        run: ./scripts/setup_native_ci_display.ps1

      - name: Prepare modern software OpenGL
        shell: pwsh
        run: ./scripts/setup_native_ci_graphics.ps1

      - name: Verify native graphics bootstrap
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir native/build-ci -C Release --no-tests=error -R "^(system_resource_probe|native_infinite_reference_grid|native_light_gaussian_interaction|native_textured_paged_mesh_scene)$" --output-on-failure

      - name: Test
        shell: pwsh
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir native/build-ci -C Release --no-tests=error --output-on-failure

      - name: Test native worker
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
          GSW_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/gsw-security-fixtures
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { throw "The hosted runner is missing Node for the test-owned argv receiver." }
          & $env:QA_PYTHON -B -m unittest native.worker.test_gsw_worker native.worker.test_import_preflight native.worker.test_training_runtime native.worker.test_training_step_profile native.worker.test_training_resource_policy native.worker.test_training_acceleration native.worker.test_training_loss native.worker.test_surfel_regularization native.worker.test_training_checkpoint crop_editor.tests.test_training_backends crop_editor.tests.test_path_security crop_editor.tests.test_command_security
          if ($LASTEXITCODE -ne 0) { throw "Native worker tests failed." }

      - name: Parse setup scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/build_native.ps1",
            "scripts/write_native_source_manifest.ps1",
            "scripts/bootstrap_3dgs_editor.ps1",
            "scripts/check_3dgs_env.ps1",
            "scripts/install_colmap.ps1",
            "scripts/sign_windows_artifacts.ps1",
            "scripts/stage_native_backend.ps1",
            "scripts/setup_native_ci_display.ps1",
            "scripts/setup_native_ci_graphics.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }

      - name: Install application
        shell: pwsh
        run: cmake --install native/build-ci --config Release --prefix native/artifact

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "native/artifact/bin/Gaussian Scene Workbench.exe"
          windeployqt --release --no-translations --compiler-runtime $exe
          Copy-Item native/README.md native/artifact/README.md
          Copy-Item native/build_manifest.json native/artifact/build_manifest.json
          Copy-Item docs/NATIVE_MIGRATION.md native/artifact/NATIVE_MIGRATION.md
          Copy-Item docs/NATIVE_PARITY.md native/artifact/NATIVE_PARITY.md
          Copy-Item docs/COLMAP_SETUP.md native/artifact/COLMAP_SETUP.md
          Copy-Item docs/WINDOWS_APPLICATION_CONTROL.md native/artifact/WINDOWS_APPLICATION_CONTROL.md
          Copy-Item LICENSE native/artifact/LICENSE
          Copy-Item COPYING native/artifact/COPYING
          Copy-Item native/LICENSE.md native/artifact/native/LICENSE.md
          ./scripts/write_native_source_manifest.ps1 -PackageRoot (Join-Path $PWD 'native/artifact')
          Copy-Item THIRD_PARTY_LICENSES.md native/artifact/THIRD_PARTY_LICENSES.md
          Copy-Item docs/LOCALIZATION.md native/artifact/LOCALIZATION.md
          Copy-Item docs/STUDIO_COMPARISON.md native/artifact/STUDIO_COMPARISON.md

      - name: Stage native compute backend
        shell: pwsh
        run: >-
          ./scripts/stage_native_backend.ps1
          -SourceRoot $PWD
          -DestinationRoot (Join-Path $PWD "native/artifact")

      - name: Verify native-only package
        shell: pwsh
        env:
          QA_PYTHON: ${{ steps.qa-python.outputs.python-path }}
        run: |
          & $env:QA_PYTHON -B -c "from pathlib import Path; files=[Path('native/artifact/native/worker/gsw_worker.py'),Path('native/artifact/native/worker/import_preflight.py'),Path('native/artifact/native/worker/training_preflight.py'),Path('native/artifact/crop_editor/server.py'),Path('native/artifact/crop_editor/video_extract.py')]; [compile(path.read_bytes(),str(path),'exec') for path in files]"
          if ($LASTEXITCODE -ne 0) { throw "Packaged Python syntax check failed." }
          $forbidden = Get-ChildItem native/artifact -Recurse -File | Where-Object {
            $_.Name -match '^(node|electron)\.exe$' -or
            $_.Name -match '^Qt6WebEngine' -or
            $_.Extension -in '.html', '.js', '.css'
          }
          if ($forbidden) {
            $forbidden | Select-Object -ExpandProperty FullName
            throw "Native artifact contains a forbidden web runtime file."
          }
          $exe = "native/artifact/bin/Gaussian Scene Workbench.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Native executable is missing."
          }
          $requiredBackend = @(
            "native/artifact/native/worker/gsw_worker.py",
            "native/artifact/native/worker/import_preflight.py",
            "native/artifact/native/worker/training_preflight.py",
            "native/artifact/crop_editor/server.py",
            "native/artifact/crop_editor/video_extract.py",
            "native/artifact/scripts/check_3dgs_env.ps1",
            "native/artifact/gaussian-splatting/train.py",
            "native/artifact/training_kit/apply_local_fixes.bat",
            "native/artifact/scripts/install_colmap.ps1",
            "native/artifact/scripts/sign_windows_artifacts.ps1",
            "native/artifact/COLMAP_SETUP.md",
            "native/artifact/WINDOWS_APPLICATION_CONTROL.md",
            "native/artifact/backend_manifest.json"
          )
          $missingBackend = $requiredBackend | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missingBackend) {
            $missingBackend
            throw "Native artifact is missing required compute backend files."
          }

      - name: Upload Windows preview
        uses: actions/upload-artifact@v7
        with:
          name: Gaussian-Scene-Workbench-0.3.1-native-preview-win-x64
          path: native/artifact/
          if-no-files-found: error
          retention-days: 30

      # Keep a failed run failed, but retain binaries and logs for reproducing
      # rendering failures on a workstation with a hardware OpenGL driver.
      - name: Collect failed-run diagnostic build
        if: failure() && steps.native-build.outcome == 'success'
        shell: pwsh
        run: |
          $root = Join-Path $PWD "native/diagnostic-artifact"
          cmake --install native/build-ci --config Release --prefix $root
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic install failed." }
          windeployqt --release --no-translations --compiler-runtime "$root/bin/Gaussian Scene Workbench.exe"
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic runtime deployment failed." }
          Copy-Item native/build_manifest.json "$root/build_manifest.json"
          ./scripts/stage_native_backend.ps1 -SourceRoot $PWD -DestinationRoot $root
          Copy-Item native/build-ci/Testing "$root/Testing" -Recurse
          Copy-Item native/build-ci/Release/gsw_gaussian_sh_tests.exe "$root/bin/"

      - name: Upload failed-run diagnostics
        if: failure() && steps.native-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-failed-run-diagnostics
          path: native/diagnostic-artifact/
          if-no-files-found: error
          retention-days: 7
