name: Windows Installer

on:
  push:
    branches: [main, codex/windows-installer]
    paths:
      - 'packaging/windows/**'
      - 'scripts/*windows_installer*'
      - 'scripts/*native_crt*'
      - 'scripts/test_windows_shortcut_unicode.ps1'
      - 'scripts/bootstrap_inno_setup.ps1'
      - '.github/workflows/windows-installer.yml'
      - 'native/i18n/catalog.json'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/windows/**'
      - 'scripts/*windows_installer*'
      - 'scripts/*native_crt*'
      - 'scripts/test_windows_shortcut_unicode.ps1'
      - 'scripts/bootstrap_inno_setup.ps1'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows setup acceptance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - name: Validate translations and installer contracts
        shell: pwsh
        run: |
          python -B scripts/native_i18n.py
          if ($LASTEXITCODE -ne 0) { throw 'Translation validation failed.' }
          python -B scripts/test_native_i18n.py
          if ($LASTEXITCODE -ne 0) { throw 'Translation regression failed.' }
          python -B scripts/test_windows_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer contract tests failed.' }
          ./scripts/test_windows_shortcut_unicode.ps1 -TestRoot "$env:RUNNER_TEMP/gsw-shortcut-validation"
      # This is an explicitly synthetic, never-executed file payload for testing
      # the real installer shell. It is not an accepted native app or release.
      # Actual candidate installation is tested separately; published Setup is
      # still gated by the complete Native Windows app/worker/package workflow.
      - name: Create marked installer-only fixture
        shell: pwsh
        run: |
          python -I -B scripts/create_windows_installer_fixture.py --output-root "$env:RUNNER_TEMP/gsw-installer-fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Installer fixture creation failed.' }
          $fixture = Get-Content "$env:RUNNER_TEMP/gsw-installer-fixture/fixture.json" -Raw | ConvertFrom-Json
          if (-not $fixture.installerFixture -or $fixture.productionReleaseAllowed -or $fixture.applicationExecutable) { throw 'Fixture safety identity is invalid.' }
      - name: Build isolated test installer
        id: build-setup
        shell: pwsh
        run: |
          $fixture = Get-Content "$env:RUNNER_TEMP/gsw-installer-fixture/fixture.json" -Raw | ConvertFrom-Json
          $compiler = ./scripts/bootstrap_inno_setup.ps1 -InstallRoot "$env:RUNNER_TEMP/gsw-inno-7.1.0" -CacheRoot "$env:RUNNER_TEMP/gsw-inno-cache"
          ./scripts/build_windows_installer.ps1 -PackageRoot $fixture.packageRoot -OutputDirectory "$env:RUNNER_TEMP/gsw-setup-test" -InnoCompiler $compiler -PythonExecutable '${{ steps.python.outputs.python-path }}' -TestBuild
      - name: Test install upgrade and data-preserving uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP/gsw-setup-test" -File -Filter '*.exe').FullName
          ./scripts/test_windows_installer.ps1 -SetupPath $setup -TestRoot "$env:RUNNER_TEMP/gsw-setup-validation"
      - name: Verify actual three-language wizard
        if: ${{ !cancelled() && steps.build-setup.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          $setup = (Get-ChildItem "$env:RUNNER_TEMP/gsw-setup-test" -File -Filter '*.exe').FullName
          ./scripts/test_windows_installer_ui.ps1 -SetupPath $setup -TestRoot "$env:RUNNER_TEMP/gsw-setup-ui"
      - name: Upload installer test evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-acceptance
          path: |
            ${{ runner.temp }}/gsw-installer-fixture/fixture.json
            ${{ runner.temp }}/gsw-setup-validation/
            ${{ runner.temp }}/gsw-setup-ui/
            ${{ runner.temp }}/gsw-shortcut-validation/
          if-no-files-found: warn
          retention-days: 14
