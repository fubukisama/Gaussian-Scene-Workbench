name: Native Auto Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/updater/**'
      - 'native/updater-ui/**'
      - 'native/updater-developer/**'
      - 'native/src/NativeDeveloperPublisher*'
      - 'native/updater-trust/**'
      - 'native/third_party/tough/**'
      - 'native/third_party/miniz/**'
      - 'native/third_party/nlohmann/**'
      - 'native/third_party/qt-process-quote/**'
      - 'native/src/NativeUpdate*'
      - 'native/src/NativeActivation*'
      - 'native/src/NativeStartup*'
      - 'native/src/NativeRecovery*'
      - 'native/src/NativeInstallation*'
      - 'native/src/NativeLauncher.cpp'
      - 'native/src/main.cpp'
      - 'native/src/MainWindow.*'
      - 'native/src/NativeViewport.*'
      - 'native/src/AppLanguage.*'
      - 'native/CMakeLists.txt'
      - 'native/i18n/catalog.json'
      - 'native/tests/NativeUpdate*'
      - 'packaging/updates/**'
      - 'scripts/*native_update*'
      - 'scripts/*native_release_gate*'
      - 'scripts/prepare_native_update_trust_ci.py'
      - 'scripts/test_native_developer_publisher.py'
      - 'scripts/verify_native_update_source_bundle.py'
      - 'scripts/prepare_native_update_source.py'
      - '.github/workflows/native-auto-update.yml'

# This workflow only builds/tests isolated candidates. Ordinary main pushes
# never create Releases, obtain signing credentials or promote a channel.
permissions:
  contents: read

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/native/.cache/updater-pip
  CARGO_HOME: ${{ github.workspace }}/native/.cache/updater-cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/native/build-auto-update/rust

jobs:
  isolated-profile-configuration:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CARGO_HOME: D:/gu/c
      RUSTUP_HOME: D:/gu/r
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
          check-latest: true
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Prepare public test data only for distinct configuration probes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-profile,native/profile-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-profile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-profile" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-profile"
          if($LASTEXITCODE -ne 0){throw 'Profile QA environment failed.'}
          & "$PWD/native/.qa-profile/Scripts/python.exe" -m pip install -r packaging/updates/fixture-requirements.txt
          if($LASTEXITCODE -ne 0){throw 'Profile fixture dependencies failed.'}
          & "$PWD/native/.qa-profile/Scripts/python.exe" -I -B scripts/prepare_native_update_trust_ci.py `
            --root "$PWD/native/.profile-fixture" --source-commit (git rev-parse HEAD).Trim() `
            --source-tree (git rev-parse 'HEAD^{tree}').Trim()
          if($LASTEXITCODE -ne 0){throw 'Ephemeral public-root fixture failed.'}
          $prepared=Get-Content native/.profile-fixture/preparation.json -Raw | ConvertFrom-Json
          $env:GSW_PROFILE_SOURCE=$prepared.profile
          $env:GSW_PROFILE_OUTPUT="$PWD/native/.profile-fixture/native-profile.json"
          & "$PWD/native/.qa-profile/Scripts/python.exe" -I -B -c "import json,os,pathlib; p=json.loads(pathlib.Path(os.environ['GSW_PROFILE_SOURCE']).read_text(encoding='utf-8')); p['product']='Fubukisama.GaussianSceneWorkbench.Native'; p['approvedHosts']=['updates.example.invalid']; p.pop('fixtureCaPem',None); p['channels']={c:{'metadataBase':'https://updates.example.invalid/'+c+'/metadata/','targetsBase':'https://updates.example.invalid/'+c+'/targets/'} for c in ('stable','preview')}; pathlib.Path(os.environ['GSW_PROFILE_OUTPUT']).write_text(json.dumps(p),encoding='utf-8')"
          if($LASTEXITCODE -ne 0){throw 'Public configuration probe data failed.'}
          "GSW_UPDATER_PRODUCTION_PROFILE_PATH=$env:GSW_PROFILE_OUTPUT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build default and configured developer probes in separate targets
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Profile pinned Rust unavailable.'}
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release `
            --bin gsw-trust-profile-probe --features profile-probe --target-dir D:/gu/profile-default
          if($LASTEXITCODE -ne 0){throw 'Default profile probe build failed.'}
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release `
            --bin gsw-trust-profile-probe --features profile-probe,production-profile --target-dir D:/gu/profile-configured
          if($LASTEXITCODE -ne 0){throw 'Configured developer probe build failed.'}
      - name: Exercise compile-time profile boundary without network or adoption
        shell: pwsh
        run: |
          & "$PWD/native/.qa-profile/Scripts/python.exe" -I -B native/updater-trust/tests/remote_profile_contract.py `
            --default-probe D:/gu/profile-default/release/gsw-trust-profile-probe.exe `
            --configured-probe D:/gu/profile-configured/release/gsw-trust-profile-probe.exe 2>&1 | Tee-Object native/profile-evidence/contracts.log
          if($LASTEXITCODE -ne 0){throw 'Compiled-profile public boundary failed.'}
      - name: Reject unsafe developer configuration inputs in isolated probe targets
        shell: pwsh
        run: |
          & "$PWD/native/.qa-profile/Scripts/python.exe" -I -B native/updater-trust/tests/remote_profile_rejections.py `
            --cargo rustup --toolchain 1.99.1 --manifest "$PWD/native/updater-trust/Cargo.toml" `
            --profile $env:GSW_UPDATER_PRODUCTION_PROFILE_PATH --target-dir D:/gu/profile-configured `
            --work-root D:/gu/profile-rejection-evidence
          if($LASTEXITCODE -ne 0){throw 'Unsafe compiled-profile input was accepted.'}
      - name: Record probe-only scope and stop the owned setup server
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/profile-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='developer-configuration-probe-only';
            production=false;productionLibraryConfigured=false;sourceCommit=(git rev-parse HEAD).Trim();
            sourceTree=(git rev-parse 'HEAD^{tree}').Trim();runId=$env:GITHUB_RUN_ID;
            runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/profile-evidence/source.json
          if(Test-Path native/.profile-fixture/preparation.json){
            $prepared=Get-Content native/.profile-fixture/preparation.json -Raw | ConvertFrom-Json
            $process=Get-CimInstance Win32_Process -Filter "ProcessId=$($prepared.serverPid)" -ErrorAction SilentlyContinue
            if($process.CommandLine -and $process.CommandLine.Contains('native_update_network_fixture.py') -and
                $process.CommandLine.Contains($prepared.root)){
              Stop-Process -Id $prepared.serverPid -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-profile-evidence
          path: |
            native/profile-evidence/
            D:/gu/profile-rejection-evidence/*.json
            D:/gu/profile-rejection-evidence/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  isolated-source-closure:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_HOME: D:/gu/c
      RUSTUP_HOME: D:/gu/r
      CARGO_TARGET_DIR: D:/gu/source-target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: true
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Verify actual exact-source and locked registry closure without running payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-source-proof -Force | Out-Null
          $env:TEMP="$PWD/native/.tmp-source-proof"; $env:TMP=$env:TEMP
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'Source-proof pinned Rust unavailable.'}
          python -I -B scripts/verify_native_update_source_bundle.py --root D:/gs/pkg `
            --repository "$PWD" --evidence "$PWD/native/source-proof-evidence" `
            --source-commit (git rev-parse HEAD).Trim() --source-tree (git rev-parse 'HEAD^{tree}').Trim() `
            --cargo-home D:/gu/c
          if($LASTEXITCODE -ne 0){throw 'Actual corresponding-source closure failed.'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-source-proof-evidence
          path: native/source-proof-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  isolated-developer-core:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          check-latest: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - name: Build separate unsigned-local developer adapter only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-developer -Force | Out-Null
          $env:TEMP="$PWD/native/.tmp-developer"; $env:TMP=$env:TEMP
          cmake -S native/updater-developer -B native/build-developer-publisher -G 'Visual Studio 17 2022' -A x64
          if($LASTEXITCODE -ne 0){throw 'Developer adapter configure failed.'}
          cmake --build native/build-developer-publisher --config Release --target gsw_native_developer_publisher
          if($LASTEXITCODE -ne 0){throw 'Developer adapter build failed.'}
          $publisher="$PWD/native/build-developer-publisher/Release/GSW Native Developer Publisher.exe"
          windeployqt --release --no-translations --compiler-runtime $publisher
          if($LASTEXITCODE -ne 0){throw 'Developer adapter fixture runtime failed.'}
          python -I -B scripts/test_native_developer_publisher.py --remote-fixture-only `
            --publisher $publisher --work-root D:/gu/developer-red --evidence "$PWD/native/developer-evidence"
          if($LASTEXITCODE -ne 0){throw 'Shared native developer activation contract failed.'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-developer-evidence
          path: native/developer-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  isolated-update-ui:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
          check-latest: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - name: Build production UI and distinct process-boundary fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-update-ui,native/build-update-ui/ui-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-update-ui" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-update-ui" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S native/updater-ui -B native/build-update-ui -G 'Visual Studio 17 2022' -A x64 "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          if($LASTEXITCODE -ne 0){throw 'Update UI configure failed.'}
          cmake --build native/build-update-ui --config Release --parallel --target gsw_update_ui_tests gsw_update_ui_production
          if($LASTEXITCODE -ne 0){throw 'Update UI build failed.'}
      - name: Real widgets three languages cancellation and silent background checks
        shell: pwsh
        run: |
          ctest --test-dir native/build-update-ui -C Release --no-tests=error --output-on-failure `
            --output-log "$PWD/native/build-update-ui/ui-evidence/ctest.log" `
            --output-junit "$PWD/native/build-update-ui/ui-evidence/results.xml"
          if($LASTEXITCODE -ne 0){throw 'Update UI public behavior failed.'}
      - name: Record exact UI evidence scope
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/build-update-ui/ui-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='real-widgets-external-helper-fixture';
            production=false;formalGswAcceptance=false;sourceCommit=(git rev-parse HEAD).Trim();
            sourceTree=(git rev-parse 'HEAD^{tree}').Trim();runId=$env:GITHUB_RUN_ID;
            runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/build-update-ui/ui-evidence/source.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-ui-evidence
          path: native/build-update-ui/ui-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  release-policy-contracts:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual public archive and policy boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-policy,native/policy-evidence -Force | Out-Null
          $env:TEMP="$PWD/native/.tmp-policy"; $env:TMP=$env:TEMP
          python -I -B -m unittest discover -s scripts -p test_native_update_archive.py -v 2>&1 | Tee-Object native/policy-evidence/archive.log
          $archiveExit=$LASTEXITCODE
          python -I -B -m unittest discover -s scripts -p test_native_release_gate.py -v 2>&1 | Tee-Object native/policy-evidence/policy.log
          if($archiveExit -ne 0 -or $LASTEXITCODE -ne 0){throw 'Archive or release policy contract failed.'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-policy-evidence
          path: native/policy-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  isolated-contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - name: Install isolated TLS fixture dependency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-updater"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture QA environment unavailable.' }
          & "$PWD/native/.qa-updater/Scripts/python.exe" -m pip install 'cryptography==50.0.2'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture TLS dependency unavailable.' }
      - name: Build native download boundary
        shell: pwsh
        run: |
          cmake -S native/updater -B native/build-auto-update -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON "-DPython3_EXECUTABLE=$PWD/native/.qa-updater/Scripts/python.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Updater configure failed.' }
          cmake --build native/build-auto-update --config Release --parallel --target gsw_update_download_tests gsw_update_activation_tests gsw_update_path_tests
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed.' }
      - name: Actual HTTPS download contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          ctest --test-dir native/build-auto-update -C Release --no-tests=error --output-on-failure `
            --output-log native/auto-update-evidence/download.log `
            --output-junit "$PWD/native/auto-update-evidence/download.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Real native HTTPS contract failed.' }
      - name: Complete archive contract
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          & "$PWD/native/.qa-updater/Scripts/python.exe" -I -B -m unittest discover -s scripts -p test_native_update_archive.py -v 2>&1 | Tee-Object native/auto-update-evidence/archive.log
          if ($LASTEXITCODE -ne 0) { throw 'Archive contract failed.' }
      - name: Fail-closed release policy contract
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & "$PWD/native/.qa-updater/Scripts/python.exe" -I -B -m unittest discover -s scripts -p test_native_release_gate.py -v 2>&1 | Tee-Object native/auto-update-evidence/release-gate.log
          if ($LASTEXITCODE -ne 0) { throw 'Release policy contract failed.' }
      - name: Bind isolated evidence to source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='isolated';production=false;
            sourceCommit=(git rev-parse HEAD).Trim();sourceTree=(git rev-parse 'HEAD^{tree}').Trim();
            runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/auto-update-evidence/source.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-isolated-evidence
          path: native/auto-update-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-trust:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # aws-lc has deep relative includes; a short D: cache avoids MAX_PATH
      # failures without weakening entropy, compiler or signature checks.
      CARGO_HOME: D:/gu/c
      CARGO_TARGET_DIR: D:/gu/p
      RUSTUP_HOME: D:/gu/r
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Prepare isolated signed HTTPS repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater,native/auto-update-trust-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-updater-trust"
          if ($LASTEXITCODE -ne 0) { throw 'Trust fixture QA environment unavailable.' }
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -m pip install -r packaging/updates/fixture-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Trust fixture dependencies unavailable.' }
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -I -B scripts/prepare_native_update_trust_ci.py `
            --with-short-expiry --root "$PWD/native/.trust-fixture" --source-commit (git rev-parse HEAD).Trim() `
            --source-tree (git rev-parse 'HEAD^{tree}').Trim() 2>&1 | Tee-Object native/auto-update-trust-evidence/prepare.log
          if ($LASTEXITCODE -ne 0) { throw 'Signed fixture preparation failed.' }
          $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
          "GSW_UPDATER_FIXTURE_PROFILE_PATH=$($prepared.profile)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build independent production and fixture trust binaries
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust SDK unavailable.' }
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --lib --target-dir D:/gu/p
          if ($LASTEXITCODE -ne 0) { throw 'Production trust library failed.' }
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --features fixture-cli --target-dir D:/gu/f
          if ($LASTEXITCODE -ne 0) { throw 'Distinct fixture trust binary failed.' }
      - name: Real signature and replay contract
        shell: pwsh
        run: |
          $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -I -B native/updater-trust/tests/remote_trust_contract.py `
            --cli 'D:/gu/f/release/gsw-trust-fixture-cli.exe' `
            --fixture $prepared.fixture --work-root "$PWD/native/.trust-contract" 2>&1 | Tee-Object native/auto-update-trust-evidence/trust.log
          if ($LASTEXITCODE -ne 0) { throw 'Real TUF signature/replay contract failed.' }
      - name: Record scope and stop only the test server
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-trust-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='isolated';production=false;
            sourceCommit=(git rev-parse HEAD).Trim();sourceTree=(git rev-parse 'HEAD^{tree}').Trim();
            runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/auto-update-trust-evidence/source.json
          if(Test-Path native/.trust-fixture/preparation.json){
            $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
            foreach($owned in @(@{pid=$prepared.serverPid;script='native_update_network_fixture.py'},
                                @{pid=$prepared.issuerPid;script='create_native_update_fixture.py'})){
              if($owned.pid){
                $process=Get-CimInstance Win32_Process -Filter "ProcessId=$($owned.pid)" -ErrorAction SilentlyContinue
                if($process.CommandLine -and $process.CommandLine.Contains($owned.script) -and
                    $process.CommandLine.Contains($prepared.root)){
                  Stop-Process -Id $owned.pid -ErrorAction SilentlyContinue
                }
              }
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-trust-evidence
          path: native/auto-update-trust-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-stable-entry:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CARGO_HOME: D:/gu/c
      RUSTUP_HOME: D:/gu/r
      CARGO_TARGET_DIR: D:/gu/e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Build actual test windows and exact stable launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater,native/update-e2e-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-update-e2e"
          if($LASTEXITCODE -ne 0){throw 'E2E isolated Python unavailable.'}
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -m pip install -r packaging/updates/fixture-requirements.txt
          if($LASTEXITCODE -ne 0){throw 'E2E fixture dependencies unavailable.'}
          cmake -S native/updater -B native/build-update-e2e -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF -DGSW_UPDATER_FIXTURE_BUILD=ON
          if($LASTEXITCODE -ne 0){throw 'E2E native configure failed.'}
          cmake --build native/build-update-e2e --config Release --parallel --target gsw_update_application_fixture_a gsw_update_application_fixture_b gsw_update_fixture_launcher
          if($LASTEXITCODE -ne 0){throw 'E2E native windows/launcher build failed.'}
      - name: Issue private isolated A B and bad C
        shell: pwsh
        run: |
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -I -B scripts/prepare_native_update_end_to_end.py `
            --remote-fixture-only --root "$PWD/native/.update-e2e" `
            --fixture-a "$PWD/native/build-update-e2e/fixture-A/Release/Gaussian Scene Workbench.exe" `
            --fixture-b "$PWD/native/build-update-e2e/fixture-B/Release/Gaussian Scene Workbench.exe" `
            --launcher "$PWD/native/build-update-e2e/Release/Gaussian Scene Workbench Launcher.exe" `
            --windeployqt (Get-Command windeployqt).Source --source-commit (git rev-parse HEAD).Trim() `
            --source-tree (git rev-parse 'HEAD^{tree}').Trim() 2>&1 | Tee-Object native/update-e2e-evidence/prepare.log
          if($LASTEXITCODE -ne 0){throw 'E2E private issuer failed.'}
          $prepared=Get-Content native/.update-e2e/preparation.json -Raw | ConvertFrom-Json
          "GSW_UPDATER_FIXTURE_PROFILE_PATH=$($prepared.profile)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Link distinct native test helper with the issued root
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'E2E pinned Rust unavailable.'}
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --features fixture-cli --target-dir D:/gu/e
          if($LASTEXITCODE -ne 0){throw 'E2E fixture trust build failed.'}
          cmake -S native/updater -B native/build-update-e2e -DGSW_TRUST_LIBRARY=D:/gu/e/release/gsw_updater_trust.lib
          if($LASTEXITCODE -ne 0){throw 'E2E native helper configure failed.'}
          cmake --build native/build-update-e2e --config Release --parallel --target gsw_native_update_helper
          if($LASTEXITCODE -ne 0){throw 'E2E native helper build failed.'}
      - name: Real HTTPS signature activation same entry and rollback
        shell: pwsh
        run: |
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -I -B scripts/test_native_update_end_to_end.py `
            --remote-fixture-only --preparation native/.update-e2e/preparation.json `
            --helper "$PWD/native/build-update-e2e/Release/GSW Update Fixture Helper.exe" `
            --trust-cli D:/gu/e/release/gsw-trust-fixture-cli.exe --windeployqt (Get-Command windeployqt).Source `
            --evidence "$PWD/native/update-e2e-evidence" 2>&1 | Tee-Object native/update-e2e-evidence/end-to-end.log
          if($LASTEXITCODE -ne 0){throw 'Real stable-entry lifecycle contract failed.'}
      - name: Record isolated identity and stop only the test server
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/update-e2e-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='real-qt-fixture-stable-launcher-only';
            production=false;formalGswAcceptance=false;sourceCommit=(git rev-parse HEAD).Trim();
            sourceTree=(git rev-parse 'HEAD^{tree}').Trim();runId=$env:GITHUB_RUN_ID;
            runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/update-e2e-evidence/source.json
          if(Test-Path native/.update-e2e/preparation.json){
            $prepared=Get-Content native/.update-e2e/preparation.json -Raw | ConvertFrom-Json
            if($prepared.serverPid){Stop-Process -Id $prepared.serverPid -ErrorAction SilentlyContinue}
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-stable-entry-evidence
          path: native/update-e2e-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
