name: Native Auto Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/updater/**'
      - 'native/updater-trust/**'
      - 'native/third_party/tough/**'
      - 'native/third_party/miniz/**'
      - 'native/third_party/nlohmann/**'
      - 'native/src/NativeUpdate*'
      - 'native/src/NativeActivation*'
      - 'native/tests/NativeUpdate*'
      - 'packaging/updates/**'
      - 'scripts/*native_update*'
      - 'scripts/*native_release_gate*'
      - 'scripts/prepare_native_update_trust_ci.py'
      - '.github/workflows/native-auto-update.yml'

# This workflow only builds/tests isolated candidates. Ordinary main pushes
# never create Releases, obtain signing credentials or promote a channel.
permissions:
  contents: read

env:
  PIP_CACHE_DIR: ${{ github.workspace }}/native/.cache/updater-pip
  CARGO_HOME: ${{ github.workspace }}/native/.cache/updater-cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/native/build-auto-update/rust

jobs:
  release-policy-contracts:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actual public archive and policy boundaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-policy,native/policy-evidence -Force | Out-Null
          $env:TEMP="$PWD/native/.tmp-policy"; $env:TMP=$env:TEMP
          python -I -B -m unittest discover -s scripts -p test_native_update_archive.py -v 2>&1 | Tee-Object native/policy-evidence/archive.log
          $archiveExit=$LASTEXITCODE
          python -I -B -m unittest discover -s scripts -p test_native_release_gate.py -v 2>&1 | Tee-Object native/policy-evidence/policy.log
          if($archiveExit -ne 0 -or $LASTEXITCODE -ne 0){throw 'Archive or release policy contract failed.'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-policy-evidence
          path: native/policy-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  isolated-contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - name: Install isolated TLS fixture dependency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-updater"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture QA environment unavailable.' }
          & "$PWD/native/.qa-updater/Scripts/python.exe" -m pip install 'cryptography==50.0.2'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture TLS dependency unavailable.' }
      - name: Build native download boundary
        shell: pwsh
        run: |
          cmake -S native/updater -B native/build-auto-update -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON "-DPython3_EXECUTABLE=$PWD/native/.qa-updater/Scripts/python.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Updater configure failed.' }
          cmake --build native/build-auto-update --config Release --parallel --target gsw_update_download_tests gsw_update_activation_tests
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed.' }
      - name: Actual HTTPS download contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          ctest --test-dir native/build-auto-update -C Release --no-tests=error --output-on-failure `
            --output-log native/auto-update-evidence/download.log `
            --output-junit "$PWD/native/auto-update-evidence/download.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Real native HTTPS contract failed.' }
      - name: Complete archive contract
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          & "$PWD/native/.qa-updater/Scripts/python.exe" -I -B -m unittest discover -s scripts -p test_native_update_archive.py -v 2>&1 | Tee-Object native/auto-update-evidence/archive.log
          if ($LASTEXITCODE -ne 0) { throw 'Archive contract failed.' }
      - name: Fail-closed release policy contract
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & "$PWD/native/.qa-updater/Scripts/python.exe" -I -B -m unittest discover -s scripts -p test_native_release_gate.py -v 2>&1 | Tee-Object native/auto-update-evidence/release-gate.log
          if ($LASTEXITCODE -ne 0) { throw 'Release policy contract failed.' }
      - name: Bind isolated evidence to source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='isolated';production=false;
            sourceCommit=(git rev-parse HEAD).Trim();sourceTree=(git rev-parse 'HEAD^{tree}').Trim();
            runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/auto-update-evidence/source.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-isolated-evidence
          path: native/auto-update-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-trust:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # aws-lc has deep relative includes; a short D: cache avoids MAX_PATH
      # failures without weakening entropy, compiler or signature checks.
      CARGO_HOME: D:/gu/c
      CARGO_TARGET_DIR: D:/gu/p
      RUSTUP_HOME: D:/gu/r
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Prepare isolated signed HTTPS repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater,native/auto-update-trust-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-updater-trust"
          if ($LASTEXITCODE -ne 0) { throw 'Trust fixture QA environment unavailable.' }
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -m pip install -r packaging/updates/fixture-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Trust fixture dependencies unavailable.' }
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -I -B scripts/prepare_native_update_trust_ci.py `
            --root "$PWD/native/.trust-fixture" --source-commit (git rev-parse HEAD).Trim() `
            --source-tree (git rev-parse 'HEAD^{tree}').Trim() 2>&1 | Tee-Object native/auto-update-trust-evidence/prepare.log
          if ($LASTEXITCODE -ne 0) { throw 'Signed fixture preparation failed.' }
          $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
          "GSW_UPDATER_FIXTURE_PROFILE_PATH=$($prepared.profile)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build independent production and fixture trust binaries
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust SDK unavailable.' }
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --lib --target-dir D:/gu/p
          if ($LASTEXITCODE -ne 0) { throw 'Production trust library failed.' }
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --features fixture-cli --target-dir D:/gu/f
          if ($LASTEXITCODE -ne 0) { throw 'Distinct fixture trust binary failed.' }
      - name: Real signature and replay contract
        shell: pwsh
        run: |
          $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
          & "$PWD/native/.qa-updater-trust/Scripts/python.exe" -I -B native/updater-trust/tests/remote_trust_contract.py `
            --cli 'D:/gu/f/release/gsw-trust-fixture-cli.exe' `
            --fixture $prepared.fixture --work-root "$PWD/native/.trust-contract" 2>&1 | Tee-Object native/auto-update-trust-evidence/trust.log
          if ($LASTEXITCODE -ne 0) { throw 'Real TUF signature/replay contract failed.' }
      - name: Record scope and stop only the test server
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/auto-update-trust-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='isolated';production=false;
            sourceCommit=(git rev-parse HEAD).Trim();sourceTree=(git rev-parse 'HEAD^{tree}').Trim();
            runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/auto-update-trust-evidence/source.json
          if(Test-Path native/.trust-fixture/preparation.json){
            $prepared=Get-Content native/.trust-fixture/preparation.json -Raw | ConvertFrom-Json
            if($prepared.serverPid){Stop-Process -Id $prepared.serverPid -ErrorAction SilentlyContinue}
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-trust-evidence
          path: native/auto-update-trust-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-stable-entry:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CARGO_HOME: D:/gu/c
      RUSTUP_HOME: D:/gu/r
      CARGO_TARGET_DIR: D:/gu/e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          dir: ${{ github.workspace }}/native/.qt-updater
      - uses: actions/cache@v5
        with:
          path: |
            D:/gu/c
            D:/gu/r
          key: updater-rust-1.99.1-${{ runner.os }}-${{ hashFiles('native/updater-trust/Cargo.lock') }}
      - name: Build actual test windows and exact stable launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/.tmp-updater,native/update-e2e-evidence -Force | Out-Null
          "TEMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$PWD/native/.tmp-updater" | Out-File -FilePath $env:GITHUB_ENV -Append
          & '${{ steps.python.outputs.python-path }}' -m venv "$PWD/native/.qa-update-e2e"
          if($LASTEXITCODE -ne 0){throw 'E2E isolated Python unavailable.'}
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -m pip install -r packaging/updates/fixture-requirements.txt
          if($LASTEXITCODE -ne 0){throw 'E2E fixture dependencies unavailable.'}
          cmake -S native/updater -B native/build-update-e2e -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF -DGSW_UPDATER_FIXTURE_BUILD=ON
          if($LASTEXITCODE -ne 0){throw 'E2E native configure failed.'}
          cmake --build native/build-update-e2e --config Release --parallel --target gsw_update_application_fixture_a gsw_update_application_fixture_b gsw_update_fixture_launcher
          if($LASTEXITCODE -ne 0){throw 'E2E native windows/launcher build failed.'}
      - name: Issue private isolated A B and bad C
        shell: pwsh
        run: |
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -I -B scripts/prepare_native_update_end_to_end.py `
            --remote-fixture-only --root "$PWD/native/.update-e2e" `
            --fixture-a "$PWD/native/build-update-e2e/fixture-A/Release/Gaussian Scene Workbench.exe" `
            --fixture-b "$PWD/native/build-update-e2e/fixture-B/Release/Gaussian Scene Workbench.exe" `
            --launcher "$PWD/native/build-update-e2e/Release/Gaussian Scene Workbench Launcher.exe" `
            --windeployqt (Get-Command windeployqt).Source --source-commit (git rev-parse HEAD).Trim() `
            --source-tree (git rev-parse 'HEAD^{tree}').Trim() 2>&1 | Tee-Object native/update-e2e-evidence/prepare.log
          if($LASTEXITCODE -ne 0){throw 'E2E private issuer failed.'}
          $prepared=Get-Content native/.update-e2e/preparation.json -Raw | ConvertFrom-Json
          "GSW_UPDATER_FIXTURE_PROFILE_PATH=$($prepared.profile)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Link distinct native test helper with the issued root
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if($LASTEXITCODE -ne 0){throw 'E2E pinned Rust unavailable.'}
          rustup run 1.99.1 cargo build --manifest-path native/updater-trust/Cargo.toml --locked --release --features fixture-cli --target-dir D:/gu/e
          if($LASTEXITCODE -ne 0){throw 'E2E fixture trust build failed.'}
          cmake -S native/updater -B native/build-update-e2e -DGSW_TRUST_LIBRARY=D:/gu/e/release/gsw_updater_trust.lib
          if($LASTEXITCODE -ne 0){throw 'E2E native helper configure failed.'}
          cmake --build native/build-update-e2e --config Release --parallel --target gsw_native_update_helper
          if($LASTEXITCODE -ne 0){throw 'E2E native helper build failed.'}
      - name: Real HTTPS signature activation same entry and rollback
        shell: pwsh
        run: |
          & "$PWD/native/.qa-update-e2e/Scripts/python.exe" -I -B scripts/test_native_update_end_to_end.py `
            --remote-fixture-only --preparation native/.update-e2e/preparation.json `
            --helper "$PWD/native/build-update-e2e/Release/GSW Update Fixture Helper.exe" `
            --trust-cli D:/gu/e/release/gsw-trust-fixture-cli.exe --windeployqt (Get-Command windeployqt).Source `
            --evidence "$PWD/native/update-e2e-evidence" 2>&1 | Tee-Object native/update-e2e-evidence/end-to-end.log
          if($LASTEXITCODE -ne 0){throw 'Real stable-entry lifecycle contract failed.'}
      - name: Record isolated identity and stop only the test server
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native/update-e2e-evidence -Force | Out-Null
          [ordered]@{schema='gsw.updater_isolated_evidence/1';scope='real-qt-fixture-stable-launcher-only';
            production=false;formalGswAcceptance=false;sourceCommit=(git rev-parse HEAD).Trim();
            sourceTree=(git rev-parse 'HEAD^{tree}').Trim();runId=$env:GITHUB_RUN_ID;
            runAttempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content native/update-e2e-evidence/source.json
          if(Test-Path native/.update-e2e/preparation.json){
            $prepared=Get-Content native/.update-e2e/preparation.json -Raw | ConvertFrom-Json
            if($prepared.serverPid){Stop-Process -Id $prepared.serverPid -ErrorAction SilentlyContinue}
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-auto-update-stable-entry-evidence
          path: native/update-e2e-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
