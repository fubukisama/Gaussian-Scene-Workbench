name: Native Visibility Camera

# Fast manual feedback for the six existing visibility locale/theme cases.
# This is scoped acceptance, not a replacement for Native Scene Visibility,
# Native Windows, the full native suite, workers, packaging or code scans.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-camera:
    name: Six locale and theme visibility camera contracts
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_FORCE_STDERR_LOGGING: "1"
      QT_LOGGING_TO_CONSOLE: "1"
      GSW_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/native/visibility-camera-artifact/screenshots
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@v7

      - name: Record actual source commit and run identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'native/visibility-camera-artifact'
          New-Item -ItemType Directory -Path "$evidence/screenshots" -Force | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout differs from the dispatched source commit.' }
          $head | Set-Content -LiteralPath "$evidence/source-commit.txt" -Encoding utf8
          [ordered]@{
            sourceCommit = $head
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflow = $env:GITHUB_WORKFLOW
            workflowSha = $env:GITHUB_WORKFLOW_SHA
            runnerOS = $env:RUNNER_OS
            recordedAtUtc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath "$evidence/source-run.json" -Encoding utf8

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up QA Python
        id: qa-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt

      - name: Install focused native dependencies
        shell: pwsh
        run: |
          & '${{ steps.qa-python.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Focused QA dependency installation failed.' }
          & '${{ steps.qa-python.outputs.python-path }}' -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Native source boundary verification failed.' }
          $root = Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Focused codec dependency installation failed.' }

      - name: Configure and build only the native application
        id: focused-build
        shell: pwsh
        run: |
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          cmake -S native -B native/build-visibility-camera -G 'Visual Studio 17 2022' -A x64 `
            -DBUILD_TESTING=ON -DGSW_ENABLE_RENDER_DIAGNOSTICS_CAPTURE_TEST=ON -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DCMAKE_CXX_FLAGS=/MP2' `
            '-DPython3_EXECUTABLE=${{ steps.qa-python.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/native/.deps/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'Focused native configure failed.' }
          cmake --build native/build-visibility-camera --config Release --parallel `
            --target GaussianSceneWorkbench 2>&1 |
            Tee-Object -FilePath native/visibility-camera-artifact/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Focused native build failed.' }

      - name: Prepare real Windows display and OpenGL
        id: focused-graphics
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1

      - name: Verify six unchanged visibility locale and theme cases
        if: ${{ !cancelled() && steps.focused-build.outcome == 'success' && steps.focused-graphics.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = 1
          try {
            ctest --test-dir native/build-visibility-camera -C Release --no-tests=error --verbose --output-on-failure `
              --output-log native/visibility-camera-artifact/camera-contracts.log `
              --output-junit (Join-Path $PWD 'native/visibility-camera-artifact/camera-contracts.xml') `
              -R '^native_scene_visibility_(zh_CN|en_US|ja_JP)_(light|dark)$'
            $result = $LASTEXITCODE
          } finally {
            $last = 'native/build-visibility-camera/Testing/Temporary/LastTest.log'
            if (Test-Path -LiteralPath $last) { Copy-Item -LiteralPath $last -Destination native/visibility-camera-artifact/LastTest.log }
            $failed = 'native/build-visibility-camera/Testing/Temporary/LastTestsFailed.log'
            if (Test-Path -LiteralPath $failed) { Copy-Item -LiteralPath $failed -Destination native/visibility-camera-artifact/LastTestsFailed.log }
          }
          if ($result -ne 0) { throw 'Visibility camera contracts failed; original test assertions and per-case deadlines are unchanged.' }

      - name: Upload exact-commit scoped camera and visibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-visibility-camera-acceptance
          path: |
            native/visibility-camera-artifact/
            native/build-visibility-camera/Testing/Temporary/LastTest.log
            native/build-visibility-camera/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 7
