name: Native UI Performance

# Narrow paired CPU/presentation/resource check, not GPU-throughput acceptance.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Frozen pre-AA production base; the recorded common QA overlay is applied explicitly
        required: true
        default: b0e9fae5c53156b74e247e9c56ab3d0bd1e4a0ff
        type: string

permissions:
  contents: read

jobs:
  paired-ui:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_FORCE_STDERR_LOGGING: '1'
      QT_LOGGING_TO_CONSOLE: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        id: qa
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt
      - name: Validate static contracts and the performance evaluator
        shell: pwsh
        run: |
          & '${{ steps.qa.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA dependency failure.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Native boundary failure.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/native_i18n.py
          if ($LASTEXITCODE -ne 0) { throw 'Translation failure.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/test_native_ui_performance.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent performance evaluator contract failure.' }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Build source-bound production arms with an explicit common QA overlay
        shell: pwsh
        env:
          GSW_UI_PERF_BASELINE: ${{ inputs.baseline }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GSW_UI_PERF_BASELINE -cnotmatch '^[0-9a-f]{40}$') { throw 'Baseline must be an exact commit.' }
          $frozen='b0e9fae5c53156b74e247e9c56ab3d0bd1e4a0ff'
          if($env:GSW_UI_PERF_BASELINE -cne $frozen){throw 'This measurement protocol freezes the pre-AA production base explicitly.'}
          git cat-file -e "$env:GSW_UI_PERF_BASELINE^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline commit unavailable.' }
          $root=Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Codec build failed.' }
          $a=Join-Path $root 'ui-performance-a'
          git worktree add --detach $a $env:GSW_UI_PERF_BASELINE
          if ($LASTEXITCODE -ne 0) { throw 'Detached baseline source unavailable.' }
          $evidence=Join-Path $env:RUNNER_TEMP 'gsw-ui-performance'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "GSW_UI_PERF_ROOT=$evidence" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          git -C $a diff --quiet HEAD
          if($LASTEXITCODE -ne 0){throw 'Baseline checkout was not pristine before the declared QA overlay.'}
          git diff --quiet HEAD
          if($LASTEXITCODE -ne 0){throw 'Candidate checkout was not pristine before measurement.'}
          $utf8=[Text.UTF8Encoding]::new($false,$true)
          function Get-TextSha([string]$value){
            [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8.GetBytes($value))).ToLowerInvariant()
          }
          $qaFiles=@('native/src/UiPaintObservation.h','native/src/UiPerformanceSmokeTest.cpp','native/src/UiPerformanceSmokeTest.h')
          $allowed=@($qaFiles)+@('native/src/main.cpp')
          $protected=@(git -C $a ls-tree -r --name-only HEAD -- native/src |
            Where-Object {$_ -notin $allowed -and $_ -match '(NativeViewport|Navigation|TransformGizmoRenderer|ViewportPresentation|Grid)'} |
            ForEach-Object {@{path=$_;beforeSha256=(Get-FileHash -LiteralPath (Join-Path $a $_)).Hash.ToLowerInvariant()}})
          if(-not ($protected.path -contains 'native/src/NativeViewport.cpp')){throw 'Production viewport guard missing.'}
          $fileRecords=@()
          foreach($file in $qaFiles){
            $before=(Get-FileHash -LiteralPath (Join-Path $a $file)).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination (Join-Path $a $file)
            $after=(Get-FileHash -LiteralPath (Join-Path $a $file)).Hash.ToLowerInvariant()
            if($after -cne (Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant()){throw "Common QA file differs: $file"}
            $fileRecords+=@{path=$file;beforeSha256=$before;afterSha256=$after}
          }
          $main='native/src/main.cpp'
          $baselineMain=Join-Path $a $main
          $baseMainBlob=(git -C $a rev-parse "$($frozen):$main").Trim()
          $actualMainBlob=(git -C $a hash-object "--path=$main" $baselineMain).Trim()
          if($actualMainBlob -cne $baseMainBlob){throw 'Baseline main.cpp is not the exact frozen blob.'}
          $beforeMain=[IO.File]::ReadAllText($baselineMain,$utf8)
          $candidateMain=[IO.File]::ReadAllText((Join-Path $PWD $main),$utf8)
          $pattern='(?ms)^  if \(parser\.isSet\(uiPerformanceOption\)\) \{\r?\n(?:(?!^  \}).)*^  \}\r?\n(?=  window\.show\(\);)'
          $oldMatches=[regex]::Matches($beforeMain,$pattern)
          $newMatches=[regex]::Matches($candidateMain,$pattern)
          if($oldMatches.Count -ne 1 -or $newMatches.Count -ne 1){throw 'Perf-only pre-show main block is ambiguous.'}
          $old=$oldMatches[0]
          $common=$newMatches[0].Value.Replace("`r`n","`n")
          if(([regex]::Matches($common,'prepareUiPerformanceWindow\(window\)')).Count -ne 1 -or
             ([regex]::Matches($common,'setUiPaintObservationEnabled\(true\)')).Count -ne 1 -or
             $common -match 'findChildren|setFixedSize|adjustSize'){
            throw 'Candidate pre-show block must only use the same reviewed QA preparation entry and observer enable.'
          }
          $newline=if($old.Value.Contains("`r`n")){"`r`n"}else{"`n"}
          $replacement=$common.Replace("`n",$newline)
          $prefix=$beforeMain.Substring(0,$old.Index)
          $suffix=$beforeMain.Substring($old.Index+$old.Length)
          $beforeMainSha=(Get-FileHash -LiteralPath $baselineMain).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($baselineMain,$prefix+$replacement+$suffix,$utf8)
          $afterMain=[IO.File]::ReadAllText($baselineMain,$utf8)
          if($afterMain.Substring(0,$prefix.Length) -cne $prefix -or
             $afterMain.Substring($prefix.Length+$replacement.Length) -cne $suffix){
            throw 'A non-QA main.cpp byte changed.'
          }
          $mainPatch=@{path=$main;baselineBlob=$baseMainBlob;beforeSha256=$beforeMainSha;
            afterSha256=(Get-FileHash -LiteralPath $baselineMain).Hash.ToLowerInvariant();
            beforeBlockSha256=(Get-TextSha $old.Value.Replace("`r`n","`n"));
            afterBlockSha256=(Get-TextSha $common);
            prefixUnchanged=$true;suffixUnchanged=$true}
          $changed=@(git -C $a diff --name-only HEAD)
          if(@($changed|Where-Object {$_ -notin $allowed}).Count){throw 'Unlisted baseline production change refused.'}
          foreach($guard in $protected){
            $guard['afterSha256']=(Get-FileHash -LiteralPath (Join-Path $a $guard.path)).Hash.ToLowerInvariant()
            if($guard.afterSha256 -cne $guard.beforeSha256){throw "Protected production file changed: $($guard.path)"}
          }
          $diffPath=Join-Path $evidence 'common-qa-overlay.diff'
          git -C $a diff --binary --no-ext-diff HEAD -- @allowed |
            Out-File -LiteralPath $diffPath -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'Cannot retain actual QA overlay diff.'}
          # A temporary index records the actual composite tree without changing
          # the checkout's index, a branch, or the frozen production commit.
          $previousIndex=$env:GIT_INDEX_FILE
          try {
            $env:GIT_INDEX_FILE=Join-Path $root 'ui-performance-A-composite.index'
            if(Test-Path -LiteralPath $env:GIT_INDEX_FILE){throw 'Composite index must be fresh.'}
            git -C $a read-tree $frozen
            if($LASTEXITCODE -ne 0){throw 'Cannot seed the owned composite index.'}
            git -C $a add -- @allowed
            if($LASTEXITCODE -ne 0){throw 'Cannot bind the whitelisted QA files.'}
            $compositeTree=(git -C $a write-tree).Trim()
            if($LASTEXITCODE -ne 0 -or $compositeTree -cnotmatch '^[0-9a-f]{40}$'){throw 'Cannot bind actual composite source tree.'}
          } finally {
            if($null -eq $previousIndex){Remove-Item Env:GIT_INDEX_FILE -ErrorAction SilentlyContinue}
            else{$env:GIT_INDEX_FILE=$previousIndex}
          }
          $overlayReceipt=Join-Path $evidence 'common-qa-overlay.json'
          [ordered]@{schema='gsw.ui_performance_common_qa_overlay/1';sourceProductionBaseCommit=$frozen;
            fromCommit=$env:GITHUB_SHA;files=$fileRecords;mainPatch=$mainPatch;changedPaths=$changed;
            protectedProductionFiles=$protected;unlistedTrackedDiff=@();actualDiffSha256=(Get-FileHash $diffPath).Hash.ToLowerInvariant();
            baseTree=(git -C $a rev-parse 'HEAD^{tree}').Trim();compositeTree=$compositeTree;
            untouchedBaselineBinary=$false;productionOutsideWhitelistUnchanged=$true}|ConvertTo-Json -Depth 8|
            Set-Content -LiteralPath $overlayReceipt -Encoding utf8
          $overlayIdentity=(Get-FileHash -LiteralPath $overlayReceipt).Hash.ToLowerInvariant()
          $arms=@()
          foreach($arm in @(@{name='A';source=$a;commit=$env:GSW_UI_PERF_BASELINE},@{name='B';source=$PWD.Path;commit=$env:GITHUB_SHA})) {
            $build=Join-Path $root ('ui-perf-build-'+$arm.name)
            $date=(Get-Content (Join-Path $arm.source 'native/build_manifest.json') -Raw|ConvertFrom-Json).releaseDate
            cmake -S (Join-Path $arm.source 'native') -B $build -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF `
              '-DCMAKE_CXX_FLAGS=/MP2' "-DGSW_RELEASE_DATE=$date" '-DPython3_EXECUTABLE=${{ steps.qa.outputs.python-path }}' `
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              "-DVCPKG_INSTALLED_DIR=$root/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
            if ($LASTEXITCODE -ne 0) { throw "Configure failed: $($arm.name)" }
            cmake --build $build --config Release --parallel --target GaussianSceneWorkbench 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence ('build-'+$arm.name+'.log'))
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($arm.name)" }
            $exe=Join-Path $build 'Release/Gaussian Scene Workbench.exe'
            $baseTree=(git -C $arm.source rev-parse 'HEAD^{tree}').Trim()
            $tree=if($arm.name -eq 'A'){$compositeTree}else{$baseTree}
            $arms+=@{arm=$arm.name;sourceCommit=$arm.commit;sourceProductionBaseCommit=$arm.commit;baseSourceTree=$baseTree;
              sourceTree=$tree;workingTreeIsClean=($arm.name -eq 'B');commonObserverOverlayApplied=($arm.name -eq 'A');
              commonObserverOverlayFromCommit=$env:GITHUB_SHA;commonObserverOverlayIdentity=$overlayIdentity;
              sourceDirectory=[string]$arm.source;executable=$exe;executableSha256=(Get-FileHash $exe).Hash.ToLowerInvariant()}
          }
          $afterBuildChanges=@(git -C $a diff --name-only HEAD)
          if(@($afterBuildChanges|Where-Object {$_ -notin $allowed}).Count){throw 'Build modified unlisted baseline production source.'}
          foreach($guard in $protected){
            if((Get-FileHash -LiteralPath (Join-Path $a $guard.path)).Hash.ToLowerInvariant() -cne $guard.beforeSha256){
              throw "Build changed protected production bytes: $($guard.path)"
            }
          }
          foreach($file in $qaFiles){
            if((Get-FileHash -LiteralPath (Join-Path $a $file)).Hash -cne (Get-FileHash -LiteralPath $file).Hash){
              throw "The final two-arm common QA file differs: $file"
            }
          }
          if((Get-FileHash -LiteralPath $baselineMain).Hash.ToLowerInvariant() -cne $mainPatch.afterSha256){
            throw 'Build changed the source-bound QA main block.'
          }
          git diff --quiet HEAD
          if($LASTEXITCODE -ne 0){throw 'Candidate source became dirty during build; clean-tree metadata would be false.'}
          $sourcesPath=Join-Path $evidence 'sources.json'
          [ordered]@{schema='gsw.ui_performance_sources/2';runId=$env:GITHUB_RUN_ID;runner=$env:RUNNER_NAME;arms=$arms;
            commonObserverOverlayReceipt=$overlayReceipt;commonObserverOverlayIdentity=$overlayIdentity;
            acceptanceSha256=(Get-FileHash docs/ui_upgrade_20261028/PERFORMANCE_ACCEPTANCE.json).Hash.ToLowerInvariant();
            planSha256=(Get-FileHash docs/ui_upgrade_20261028/PERFORMANCE_PLAN.md).Hash.ToLowerInvariant()}|ConvertTo-Json -Depth 6|
            Set-Content -LiteralPath $sourcesPath -Encoding utf8
          "GSW_UI_PERF_SOURCES_JSON=$sourcesPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare isolated real Windows OpenGL display
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1
      - name: Record three fresh-process pairs without screenshots or readback
        shell: pwsh
        run: |
          ./scripts/run_native_ui_performance.ps1 -EvidenceRoot $env:GSW_UI_PERF_ROOT
      - name: Apply the frozen budgets without discarding noisy results
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:GSW_UI_PERF_ROOT/manifest.json")) { throw 'Recording did not produce a complete manifest; retain build/process logs.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/check_native_ui_performance.py `
            --manifest "$env:GSW_UI_PERF_ROOT/manifest.json" `
            --acceptance docs/ui_upgrade_20261028/PERFORMANCE_ACCEPTANCE.json `
            --plan docs/ui_upgrade_20261028/PERFORMANCE_PLAN.md --output "$env:GSW_UI_PERF_ROOT/results.json"
          if ($LASTEXITCODE -ne 0) { throw 'UI performance is FAIL or INCONCLUSIVE; inspect retained raw paired data.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/gsw-ui-performance
          if-no-files-found: error
          retention-days: 14
