name: Public documentation

on:
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'LICENSE'
      - 'COPYING'
      - 'native/README.md'
      - 'native/LICENSE.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - '.github/scripts/check_public_docs.py'
      - '.github/scripts/test_public_docs.py'
      - '.github/workflows/documentation.yml'
      - 'scripts/check_native_branding.py'
      - 'native/src/main.cpp'
      - 'native/src/NativeLauncher.cpp'
      - 'native/src/NativeInstallation.h'
      - 'native/assets/gsw-app-icon.rc'
      - 'native/build_manifest.json'
      - 'native/i18n/catalog.json'
      - 'packaging/windows/gsw.iss'
  pull_request:
    paths:
      - 'README*.md'
      - 'LICENSE'
      - 'COPYING'
      - 'native/README.md'
      - 'native/LICENSE.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - '.github/scripts/check_public_docs.py'
      - '.github/scripts/test_public_docs.py'
      - '.github/workflows/documentation.yml'
      - 'scripts/check_native_branding.py'
      - 'native/src/main.cpp'
      - 'native/src/NativeLauncher.cpp'
      - 'native/src/NativeInstallation.h'
      - 'native/assets/gsw-app-icon.rc'
      - 'native/build_manifest.json'
      - 'native/i18n/catalog.json'
      - 'packaging/windows/gsw.iss'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public document formatting and links
        run: python -B .github/scripts/check_public_docs.py
      - name: Verify overview guard regressions
        run: python -B .github/scripts/test_public_docs.py
      - name: Check display brand and persistent identity compatibility
        run: python -B scripts/check_native_branding.py
