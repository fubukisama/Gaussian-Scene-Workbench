name: Native UI Clarity

# Short, source-bound red/green feedback; does not replace Native Windows.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: UI acceptance slice
        type: choice
        default: baseline
        options: [oracle-only, baseline, candidate, diagnostic]

permissions:
  contents: read

jobs:
  ui-clarity:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_FORCE_STDERR_LOGGING: '1'
      QT_LOGGING_TO_CONSOLE: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Record exact source and frozen protocol
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GSW_UI_ROOT = Join-Path $env:RUNNER_TEMP 'gsw-ui'
          "GSW_UI_ROOT=$env:GSW_UI_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $env:GSW_UI_ROOT -Force | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:GITHUB_SHA) { throw 'Dispatched source mismatch.' }
          Copy-Item docs/ui_upgrade_20261028/P0_PROTOCOL.json "$env:GSW_UI_ROOT/protocol.json"
          [ordered]@{sourceCommit=$head;sourceTree=(git rev-parse 'HEAD^{tree}').Trim();runId=$env:GITHUB_RUN_ID;
            scope='${{ inputs.scope }}';protocolSha256=(Get-FileHash docs/ui_upgrade_20261028/P0_PROTOCOL.json).Hash;
            recordedUtc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json |
            Set-Content -LiteralPath "$env:GSW_UI_ROOT/source-run.json" -Encoding utf8
      - uses: actions/setup-python@v6
        id: qa
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-native-checks.txt
      - name: Install QA and validate source and translations
        shell: pwsh
        run: |
          & '${{ steps.qa.outputs.python-path }}' -m pip install -r scripts/requirements-native-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA dependencies failed.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/verify_native_backend.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Native boundary failed.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/native_i18n.py
          if ($LASTEXITCODE -ne 0) { throw 'Native translations failed.' }
      - name: Independent pixel oracle contracts
        shell: pwsh
        run: |
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/test_native_ui_clarity.py 2>&1 |
            Tee-Object -FilePath "$env:GSW_UI_ROOT/oracle-contracts.log"
          if ($LASTEXITCODE -ne 0) { throw 'Independent pixel oracle failed; preserve the red signal.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/test_native_ui_performance.py 2>&1 |
            Tee-Object -FilePath "$env:GSW_UI_ROOT/performance-contracts.log"
          if ($LASTEXITCODE -ne 0) { throw 'Performance evaluator contracts failed; no local fallback.' }
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/test_native_ui_surface_evidence.py 2>&1 |
            Tee-Object -FilePath "$env:GSW_UI_ROOT/surface-contracts.log"
          if ($LASTEXITCODE -ne 0) { throw 'Surface evidence evaluator contracts failed; no local fallback.' }
      - uses: jurplel/install-qt-action@v4
        if: inputs.scope != 'oracle-only'
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Build actual native window and navigation targets
        if: inputs.scope != 'oracle-only'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'native/.deps'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md zstd:x64-windows-static-md `
            "--x-install-root=$root/installed" "--x-buildtrees-root=$root/buildtrees" `
            "--x-packages-root=$root/packages" "--downloads-root=$root/downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Codec build failed.' }
          $date = (Get-Content native/build_manifest.json -Raw | ConvertFrom-Json).releaseDate
          $compileFlags=if('${{ inputs.scope }}' -eq 'diagnostic'){'/MP2 /Zi'}else{'/MP2'}
          $linkFlags=if('${{ inputs.scope }}' -eq 'diagnostic'){'/DEBUG:FULL'}else{''}
          cmake -S native -B native/build-ui -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON `
            "-DCMAKE_CXX_FLAGS=$compileFlags" "-DCMAKE_EXE_LINKER_FLAGS=$linkFlags" -DGSW_TEST_OPENGL_BACKEND=software "-DGSW_RELEASE_DATE=$date" `
            '-DPython3_EXECUTABLE=${{ steps.qa.outputs.python-path }}' `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$root/installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'UI configure failed.' }
          cmake --build native/build-ui --config Release --parallel --target GaussianSceneWorkbench gsw_navigation_gizmo_tests gsw_ui_overlay_raster_tests 2>&1 |
            Tee-Object -FilePath "$env:GSW_UI_ROOT/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed.' }
      - name: Prepare real remote Windows display and OpenGL
        if: inputs.scope != 'oracle-only'
        shell: pwsh
        run: |
          ./scripts/setup_native_ci_display.ps1
          ./scripts/setup_native_ci_graphics.ps1
      - name: Capture actual fractional-DPR navigation frames
        if: inputs.scope == 'baseline' || inputs.scope == 'candidate'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $core = (Get-ChildItem "$env:QT_ROOT_DIR/bin/Qt6Core.dll" -ErrorAction Stop).DirectoryName
          $env:PATH="$core;$env:PATH"
          $env:QT_PLUGIN_PATH="$env:QT_ROOT_DIR/plugins"
          $env:QT_QPA_PLATFORM='windows'
          $env:QT_OPENGL='software'
          $exe=(Resolve-Path 'native/build-ui/Release/Gaussian Scene Workbench.exe').Path
          foreach($dpr in @('1','1.25','1.5','1.75','2')) {
            foreach($samples in @('0','4')) {
              foreach($theme in @('light','dark')) {
                $case=Join-Path $env:GSW_UI_ROOT ('d'+$dpr+'-s'+$samples+'-'+$theme)
                New-Item -ItemType Directory -Path $case | Out-Null
                $env:GSW_UI_CLARITY_EVIDENCE=$case
                $env:GSW_RENDER_DIAGNOSTICS_DIR=Join-Path $case 'captures'
                $env:GSW_UI_QA_SAMPLES=$samples
                $env:QT_SCALE_FACTOR=$dpr
                # Remote runner only: suppress console creation, not the actual
                # GUI exposure required by the real QOpenGLWidget contract.
                $start=[Diagnostics.ProcessStartInfo]::new()
                $start.FileName=$exe
                $start.UseShellExecute=$false
                $start.CreateNoWindow=$true
                $start.RedirectStandardOutput=$true
                $start.RedirectStandardError=$true
                foreach($arg in @('--smoke-test-ui-clarity','--theme',$theme)) { $start.ArgumentList.Add($arg) }
                $p=[Diagnostics.Process]::Start($start)
                $stdout=$p.StandardOutput.ReadToEndAsync()
                $stderr=$p.StandardError.ReadToEndAsync()
                $timedOut=$false
                $code=$null
                try {
                  if(-not $p.WaitForExit(30000)) { $timedOut=$true; $p.Kill($true); $p.WaitForExit() }
                  $p.WaitForExit()
                  $code=$p.ExitCode
                } finally {
                  try {
                    if($stdout.Wait(5000)) { [IO.File]::WriteAllText("$case/stdout.log",$stdout.Result,[Text.UTF8Encoding]::new($false)) }
                    if($stderr.Wait(5000)) { [IO.File]::WriteAllText("$case/stderr.log",$stderr.Result,[Text.UTF8Encoding]::new($false)) }
                    [ordered]@{exitCode=$code;timedOut=$timedOut;wallLimitSeconds=30} | ConvertTo-Json |
                      Set-Content -LiteralPath "$case/process.json" -Encoding utf8
                  } finally { $p.Dispose() }
                }
                if($timedOut) { throw "Owned capture timed out: $case; logs retained" }
                if($code -ne 0) { throw "Real window capture failed: $case exit=$code" }
              }
            }
          }
          $captures=@(Get-ChildItem -LiteralPath $env:GSW_UI_ROOT -Filter capture.json -Recurse -File)
          if($captures.Count -ne 20) { throw 'The full frozen DPR/sample/theme capture matrix was not executed.' }
      - name: Evaluate navigation edges and retain all failing cases
        if: inputs.scope == 'baseline' || inputs.scope == 'candidate'
        shell: pwsh
        run: |
          & '${{ steps.qa.outputs.python-path }}' -I -B scripts/check_native_ui_clarity.py `
            --root $env:GSW_UI_ROOT --output "$env:GSW_UI_ROOT/edge-results.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual navigation edge contract failed; no tolerance relaxation.' }
      - name: Real navigation and camera regressions
        if: inputs.scope == 'candidate' || inputs.scope == 'diagnostic'
        shell: pwsh
        run: |
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          Remove-Item Env:GSW_UI_QA_SAMPLES -ErrorAction SilentlyContinue
          if ('${{ inputs.scope }}' -eq 'diagnostic') {
            $env:GSW_UI_QA_TRACE='1'
            $PSNativeCommandUseErrorActionPreference=$false
            $results=@()
            foreach($policy in @('original','grayscale-probe')) {
              $probe=Join-Path $env:GSW_UI_ROOT $policy
              New-Item -ItemType Directory -Path $probe | Out-Null
              $env:GSW_UI_CRASH_DIR=Join-Path $probe 'crashes'
              New-Item -ItemType Directory -Path $env:GSW_UI_CRASH_DIR | Out-Null
              if($policy -eq 'grayscale-probe'){$env:GSW_UI_QA_GRAYSCALE_TEXT='1'}else{Remove-Item Env:GSW_UI_QA_GRAYSCALE_TEXT -ErrorAction SilentlyContinue}
              ctest --test-dir native/build-ui -C Release --no-tests=error --output-on-failure --verbose `
                --output-log "$probe/navigation.log" `
                -R '^(native_ui_overlay_lifecycle|native_upstream_navigation_(en_US|ja_JP))$'
              $results+=@{policy=$policy;exitCode=$LASTEXITCODE;testTimeoutsUnchanged=$true}
            }
            $results|ConvertTo-Json|Set-Content -LiteralPath "$env:GSW_UI_ROOT/diagnostic-comparison.json" -Encoding utf8
            if(@($results|Where-Object exitCode -ne 0).Count){throw 'Preserved diagnostic red signal; inspect both treatment arms and first-chance fault context.'}
            exit 0
          }
          ctest --test-dir native/build-ui -C Release --no-tests=error --output-on-failure --verbose `
            --output-log "$env:GSW_UI_ROOT/navigation.log" `
            -R '^(ui_overlay_raster|native_ui_overlay_lifecycle|navigation_gizmo|native_upstream_navigation_(zh_CN|en_US|ja_JP)|native_blender_viewport_presentation_(zh_CN|en_US|ja_JP))$'
          if ($LASTEXITCODE -ne 0) { throw 'Existing actual navigation contract failed.' }
      - name: Retain diagnostic module identities and available symbols
        if: always() && inputs.scope == 'diagnostic'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $symbols=Join-Path $env:GSW_UI_ROOT 'symbols'
          New-Item -ItemType Directory -Path $symbols -Force|Out-Null
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=(& $vswhere -latest -property installationPath).Trim()
          $dumpbin=Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" -File|Sort-Object FullName -Descending|Select-Object -First 1
          if(-not $dumpbin){throw 'Installed MSVC dumpbin not found; no silent symbol identity claim.'}
          $modules=@('native/build-ui/Release/Gaussian Scene Workbench.exe',"$env:QT_ROOT_DIR/bin/Qt6Gui.dll","$env:QT_ROOT_DIR/bin/Qt6Core.dll","$env:QT_ROOT_DIR/bin/Qt6Widgets.dll")
          $identities=@()
          foreach($module in $modules){
            if(-not(Test-Path -LiteralPath $module)){continue}
            $file=Get-Item -LiteralPath $module
            & $dumpbin.FullName /exports $file.FullName|Set-Content -LiteralPath (Join-Path $symbols ($file.Name+'.exports.txt')) -Encoding utf8
            $identities+=@{name=$file.Name;sha256=(Get-FileHash $file.FullName).Hash.ToLowerInvariant();bytes=$file.Length}
          }
          $identities|ConvertTo-Json|Set-Content -LiteralPath "$symbols/modules.json" -Encoding utf8
          Get-ChildItem native/build-ui/Release -Filter '*.pdb' -File|Copy-Item -Destination $symbols
          $debugger='C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe'
          if(Test-Path -LiteralPath $debugger){
            foreach($dump in Get-ChildItem -LiteralPath $env:GSW_UI_ROOT -Filter '*.dmp' -Recurse -File){
              & $debugger -z $dump.FullName -y (Resolve-Path native/build-ui/Release).Path -c '.ecxr; k; q' 2>&1|
                Set-Content -LiteralPath ($dump.FullName+'.stack.txt') -Encoding utf8
            }
          }else{'Installed CDB unavailable; raw fault context/module offsets retained, not a symbolized stack.'|Set-Content "$symbols/cdb-NOT_RUN.txt" -Encoding utf8}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-clarity-${{ inputs.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gsw-ui
          if-no-files-found: error
          retention-days: 14
