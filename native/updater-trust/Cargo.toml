[package]
name = "gsw-updater-trust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "gsw_updater_trust"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "gsw-trust-fixture-cli"
path = "src/bin/fixture_cli.rs"
required-features = ["fixture-cli"]

[[bin]]
name = "gsw-trust-profile-probe"
path = "src/bin/profile_probe.rs"
required-features = ["profile-probe"]

[features]
default = []
fixture-profile = ["tough/gsw-fixture-store-faults"]
fixture-cli = ["fixture-profile"]
production-profile = []
profile-probe = []

[dependencies]
tough = { path = "../third_party/tough", version = "=0.24.0", default-features = false }
async-trait = "=0.1.89"
aws-lc-rs = "=1.18.2"
bytes = "=1.12.1"
futures = "=0.3.32"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt", "time", "macros", "sync"] }
url = "=2.5.8"
reqwest = { version = "=0.13.4", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-webpki = "=0.103.16"
rustls-platform-verifier = "0.7"
pem = "=3.0.6"
jiff = { version = "=0.2.38", features = ["serde"] }

[profile.release]
panic = "unwind"

